<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHL Vault</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1210;--panel:#151a16;--line:#263029;--ink:#e6e9e4;--dim:#8a948c;--amber:#f2b33d;--green:#5fd38a;--red:#f06a5a;--blue:#6fb3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Mono",ui-monospace,monospace;
       background-image:radial-gradient(circle at 20% -10%,rgba(242,179,61,.08),transparent 45%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.025) 31px 32px)}
  header{display:flex;align-items:baseline;gap:18px;padding:28px 36px 14px;border-bottom:1px solid var(--line)}
  h1{font:italic 40px/1 "Instrument Serif",serif;margin:0;letter-spacing:-.01em}
  h1 small{font:12px "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-left:12px;vertical-align:middle}
  header .sp{flex:1}
  main{padding:20px 36px 60px;max-width:1240px}
  .row{display:grid;grid-template-columns:1.3fr 1.4fr 1fr 1fr 1.2fr 1.6fr;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .row.head{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom-color:var(--amber)}
  .row:not(.head):hover{background:rgba(255,255,255,.025)}
  .id{color:var(--dim);font-size:11px}
  .name{font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .pill.done{border-color:var(--green);color:var(--green)}.pill.running{border-color:var(--amber);color:var(--amber);animation:blink 1.2s infinite}
  .pill.failed{border-color:var(--red);color:var(--red)}.pill.queued{border-color:var(--blue);color:var(--blue)}.pill.cancelled{border-color:var(--dim);color:var(--dim)}
  @keyframes blink{50%{opacity:.45}}
  button,input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:7px 11px}
  button{cursor:pointer;transition:border-color .15s,color .15s}button:hover{border-color:var(--amber);color:var(--amber)}
  button.danger:hover{border-color:var(--red);color:var(--red)}
  button.primary{background:var(--amber);color:#1b1608;border-color:var(--amber);font-weight:600}button.primary:hover{filter:brightness(1.08);color:#1b1608}
  a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .add{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 26px;padding:16px;border:1px dashed var(--line);border-radius:3px}
  .add input{min-width:220px}
  .toast{position:fixed;right:24px;bottom:24px;background:var(--panel);border:1px solid var(--amber);padding:12px 16px;border-radius:3px;opacity:0;transform:translateY(8px);transition:.25s}
  .toast.show{opacity:1;transform:none}
  details{margin-top:6px;color:var(--dim);font-size:11px}pre{white-space:pre-wrap;margin:6px 0 0;color:var(--dim)}
  .stat b{color:var(--ink)}.stat .f{color:var(--red)}
  .srcs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;color:var(--dim);font-size:12px}
  .srcs label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .pkgs{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
  .pkgs .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .pkgs .bar span{color:var(--dim);font-size:11px;margin-right:6px}
  .pkgs button{padding:4px 9px;font-size:12px}
  .pkgrow{display:flex;gap:14px;align-items:center;padding:5px 0;font-size:12px;color:var(--dim)}
  .pkgrow b{color:var(--ink)}
  @media(max-width:900px){.row{grid-template-columns:1fr 1fr;gap:8px}.row.head{display:none}}
</style>
</head>
<body>
<header>
  <h1>GHL Vault<small>file exporter</small></h1>
  <div class="sp"></div>
  <span id="conn" class="id" style="margin-right:12px"></span>
  <a href="/usage.html" style="color:var(--blue);margin-right:16px">usage analytics →</a>
  <button id="importAgency" title="Pull every sub-account via the agency token">Import sub-accounts</button>
</header>
<main>
  <div class="add">
    <input id="locId" placeholder="Location ID">
    <input id="locName" placeholder="Name (optional)">
    <input id="locPit" placeholder="Private Integration Token (optional)" style="min-width:340px">
    <button class="primary" id="addLoc">Add / update location</button>
  </div>
  <div class="srcs" id="srcs"><span>Sources for new runs:</span></div>
  <div class="row head"><div>Location</div><div>Last run</div><div>Files</div><div>Size</div><div>Downloads</div><div>Actions</div></div>
  <div id="rows"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)};
const api=(p,o={})=>fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined}).then(r=>r.json());
const fmtB=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const fmtD=s=>s?new Date(s).toLocaleString():'—';
let SOURCES=[];
async function loadSources(){SOURCES=await api('/api/sources');const box=$('#srcs');
  SOURCES.forEach(s=>{const l=document.createElement('label');l.innerHTML=`<input type=checkbox value="${s}" checked> ${s}`;box.appendChild(l)})}
const chosen=()=>[...document.querySelectorAll('#srcs input:checked')].map(i=>i.value);
let loading=false;
async function load(){
  if(loading)return;loading=true;
  let locs;
  try{const r=await fetch('/api/locations');if(!r.ok)throw new Error(r.status);locs=await r.json();if(!Array.isArray(locs))throw new Error('bad payload');$('#conn')&&($('#conn').textContent='')}
  catch(e){const c=$('#conn');if(c)c.textContent='reconnecting…';loading=false;return}   // keep what's on screen
  finally{}
  const box=$('#rows');
  if(!locs.length){if(!box.querySelector('.row'))box.innerHTML='<div class="row"><div class="id">No locations yet — add one above or import the agency.</div></div>';loading=false;return}
  const seen=new Set();
  for(const l of locs){
    seen.add(l.location_id);
    const j=l.last_job;const prog=j?Object.entries(j.progress||{}).map(([k,v])=>`${k}: ${v.status||'…'}${v.contactsSeen!=null?` · ${v.contactsSeen.toLocaleString()} contacts read`:''}${v.candidatesTotal!=null?` · ${v.candidatesTotal.toLocaleString()} with docs`:''}${v.fetched!=null?` · ${v.fetched.toLocaleString()} fetched`:''}${v.filesFound!=null?` · ${v.filesFound.toLocaleString()} files found`:''}${v.users!=null?` · ${v.users} users`:''}${v.mode?` · mode=${v.mode}`:''} ${v.error?'✗ '+v.error:''}${v.note?' · '+v.note:''}`).join('\n'):'';
    let d=box.querySelector(`.row[data-loc="${l.location_id}"]`);
    const wasOpen=d?.querySelector('details')?.open;
    const html=`
      <div><div class="name">${l.name||'(unnamed)'}</div><div class="id" title="click to copy" style="cursor:pointer" onclick="navigator.clipboard.writeText('${l.location_id}');toast('Copied')">${l.location_id} ${l.has_pit?'· PIT':'· agency'}</div></div>
      <div>${j?`<span class="pill ${j.status}">${j.status}</span> <span class="id">#${j.id}${j.since?' sync':''} ${fmtD(j.finished_at||j.created_at)}</span>${prog?`<details${wasOpen?' open':''}><summary>progress</summary><pre>${prog}</pre></details>`:''}`:'<span class="id">never run</span>'}</div>
      <div class="stat"><b>${Number(l.files_done).toLocaleString()}</b> done${Number(l.files_failed)?` · <span class="f">${Number(l.files_failed).toLocaleString()} failed</span>`:''}</div>
      <div>${fmtB(l.bytes)}</div>
      <div class="actions"><a href="/analytics.html?loc=${l.location_id}" style="color:var(--amber)">documents →</a><a href="/usage.html?loc=${l.location_id}" style="color:var(--blue)">usage →</a><a href="/api/locations/${l.location_id}/manifest.csv">manifest.csv</a><a href="/api/locations/${l.location_id}/export">download files</a>${Number(l.files_failed)?`<a href="/api/locations/${l.location_id}/failures" style="color:var(--red)">failures</a>`:''}</div>
      <div class="actions">${j&&['running','queued'].includes(j.status)?`<button data-cancel="${j.id}">Stop</button>`:`<button class="primary" data-run="${l.location_id}">Run export</button>${j&&j.status==='done'?`<button data-sync="${l.location_id}" title="Only contacts updated since the last completed export">Sync new</button>`:''}`}${j&&['cancelled','failed'].includes(j.status)?`<button data-resume="${j.id}">Resume</button>`:''}${j&&Number(l.files_failed)?`<button data-retry="${j.id}">Retry failed</button>`:''}</div>
      <div class="pkgs" id="pkgs-${l.location_id}"></div>
      <div class="actions" style="grid-column:1/-1;justify-content:flex-end;margin-top:6px"><button class="danger" data-reset="${l.location_id}">Reset data</button><button class="danger" data-del="${l.location_id}">Delete location</button></div>`;
    if(!d){d=document.createElement('div');d.className='row';d.dataset.loc=l.location_id;d.innerHTML=html;box.appendChild(d);renderPackages(l.location_id)}
    else if(d.dataset.html!==html){const pk=d.querySelector('.pkgs')?.innerHTML||'';d.innerHTML=html;d.querySelector('.pkgs').innerHTML=pk;renderPackages(l.location_id)}
    d.dataset.html=html;
  }
  box.querySelectorAll('.row').forEach(r=>{if(r.dataset.loc&&!seen.has(r.dataset.loc))r.remove();if(!r.dataset.loc&&locs.length)r.remove()});
  loading=false;
}
async function renderPackages(loc){
  const [pool,pkgs]=await Promise.all([api(`/api/locations/${loc}/pool`),api(`/api/packages?locationId=${loc}`)]);
  const el=document.getElementById(`pkgs-${loc}`);if(!el)return;
  const prev=el.innerHTML;
  const fmtN=n=>Number(n).toLocaleString();
  const next=`<div class="bar"><span>PACKAGE · ${fmtN(pool.available)} of ${fmtN(pool.total)} contacts not yet packaged</span>
    ${pool.sizes.map(s=>`<button data-pkg="${loc}" data-size="${s}" ${s>pool.available?'disabled title="not enough unassigned contacts"':''}>${s>=1000?s/1000+'k':s}</button>`).join('')}</div>`+
    pkgs.map(p=>`<div class="pkgrow"><span class="pill ${p.status}">${p.status}</span><b>#${p.id}</b>${p.locked===false?'<span class="id">export</span>':''}<span>${fmtN(p.contact_count)} contacts · ${p.status==='done'?fmtN(p.file_count)+' files':`${fmtN(p.progress.copied||0)}/${fmtN(p.progress.total||'?')} copied`}${p.progress.failed?` · <span class="f">${p.progress.failed} failed</span>`:''}</span>
      ${p.status==='done'?`<a href="/api/packages/${p.id}/contacts.csv">contacts.csv</a><a href="/api/packages/${p.id}/manifest.csv">manifest.csv</a><a href="/api/packages/${p.id}/export">download files</a><span class="id">R2: ${p.r2_prefix}</span>`:''}
      <button data-dissolve="${p.id}" title="Release these contacts back into the pool">dissolve</button></div>`).join('');
  if(next!==prev)el.innerHTML=next;
}
document.addEventListener('click',async e=>{
  const pb=e.target.closest('button[data-pkg]');
  if(pb){const r=await api(`/api/locations/${pb.dataset.pkg}/packages`,{method:'POST',body:{size:Number(pb.dataset.size)}});toast(r.error||`Package #${r.id} queued (${r.contact_count} contacts)`);renderPackages(pb.dataset.pkg);return}
  const db=e.target.closest('button[data-dissolve]');
  if(db){if(!confirm('Release this package\'s contacts back into the pool?'))return;await api(`/api/packages/${db.dataset.dissolve}`,{method:'DELETE'});toast('Dissolved');load();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.run){await api('/api/jobs',{method:'POST',body:{locationId:b.dataset.run,sources:chosen()}});toast('Queued');load()}
  if(b.dataset.reset||b.dataset.del){
    const loc=b.dataset.reset||b.dataset.del, del=!!b.dataset.del;
    if(!confirm(`${del?'Delete this location and':'Reset'} all its jobs, file records, contacts and packages?`))return;
    const purgeR2=confirm('Also delete the files already copied into R2? (Cancel = keep them)');
    const r=await api(`/api/locations/${loc}${del?'':'/reset'}`,{method:del?'DELETE':'POST',body:{purgeR2}});
    toast(r.error||`${del?'Deleted':'Reset'}${purgeR2?` · ${r.r2Deleted} R2 objects removed`:''}`);load();return}
  if(b.dataset.sync){const r=await api('/api/jobs',{method:'POST',body:{locationId:b.dataset.sync,sources:chosen(),incremental:true}});toast(r.error||`Sync queued (since ${new Date(r.since).toLocaleString()})`);load()}
  if(b.dataset.cancel){await api(`/api/jobs/${b.dataset.cancel}/cancel`,{method:'POST'});toast('Stopping after current page');load()}
  if(b.dataset.resume){await api(`/api/jobs/${b.dataset.resume}/resume`,{method:'POST'});toast('Resumed');load()}
  if(b.dataset.retry){await api(`/api/jobs/${b.dataset.retry}/retry-failed`,{method:'POST'});toast('Retry queued');load()}
});
$('#addLoc').onclick=async()=>{const r=await api('/api/locations',{method:'POST',body:{locationId:$('#locId').value.trim(),name:$('#locName').value.trim(),pitToken:$('#locPit').value.trim()}});
  toast(r.error||r.warning||`Saved ${r.name||''}`);$('#locId').value=$('#locName').value=$('#locPit').value='';load()};
$('#importAgency').onclick=async()=>{const r=await api('/api/locations/import-agency',{method:'POST'});toast(r.error||`Imported ${r.imported} locations`);load()};
loadSources();load();setInterval(load,8000);
</script>
</body>
</html>
