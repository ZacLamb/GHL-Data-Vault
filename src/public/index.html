<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHL Vault</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1210;--panel:#151a16;--panel2:#1a211c;--line:#263029;--ink:#e6e9e4;--dim:#8a948c;--amber:#f2b33d;--green:#5fd38a;--red:#f06a5a;--blue:#6fb3ff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "IBM Plex Mono",ui-monospace,monospace;
       background-image:radial-gradient(circle at 20% -10%,rgba(242,179,61,.08),transparent 45%)}
  header{display:flex;align-items:baseline;gap:18px;padding:18px 28px 10px;border-bottom:1px solid var(--line)}
  h1{font:italic 32px/1 "Instrument Serif",serif;margin:0;letter-spacing:-.01em}
  h1 small{font:11px "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-left:12px;vertical-align:middle}
  header .sp{flex:1}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .2s;min-height:calc(100vh - 62px)}
  .layout.open{grid-template-columns:minmax(0,1fr) 520px}
  main{padding:14px 28px 60px;min-width:0}
  /* agency panel */
  .agency{padding:12px 16px;border:1px solid var(--line);border-radius:3px;background:var(--panel);margin-bottom:14px}
  .agency .top{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .agency .gl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  .agency details{margin-top:8px;color:var(--dim);font-size:12px}
  .agency details summary{cursor:pointer;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;user-select:none}
  .agency details > div{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .srcs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:12px}
  .srcs label{display:flex;gap:4px;align-items:center;cursor:pointer}
  /* chips + toolbar */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  .chip{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:12px;color:var(--dim);user-select:none}
  .chip b{color:var(--ink);margin-right:5px}
  .chip.on{border-color:var(--amber);color:var(--amber)}.chip.on b{color:var(--amber)}
  .chip.red b{color:var(--red)}.chip.green b{color:var(--green)}.chip.amber b{color:var(--amber)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .toolbar input[type=search]{min-width:280px;flex:1;max-width:460px}
  .toolbar .sp{flex:1}
  /* table */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--amber);cursor:pointer;user-select:none;white-space:nowrap}
  th.r,td.r{text-align:right}
  th.sorted{color:var(--amber)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  tr.loc{cursor:pointer}tr.loc:hover td{background:rgba(255,255,255,.03)}
  tr.loc.sel td{background:rgba(242,179,61,.08)}
  td .name{font-weight:600}td .id{display:block;color:var(--dim);font-size:10px}
  .pill{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .pill.done{border-color:var(--green);color:var(--green)}.pill.running{border-color:var(--amber);color:var(--amber);animation:blink 1.2s infinite}
  .pill.failed{border-color:var(--red);color:var(--red)}.pill.queued{border-color:var(--blue);color:var(--blue)}.pill.cancelled,.pill.never{border-color:var(--dim);color:var(--dim)}
  @keyframes blink{50%{opacity:.45}}
  .f{color:var(--red)}.dim{color:var(--dim)}
  .more{display:flex;justify-content:center;padding:14px;color:var(--dim)}
  .obar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel)}.obar span{display:block;height:100%}
  #overall{margin:0 0 12px}
  .pcell{display:flex;flex-direction:column;gap:2px;line-height:1.2}.pcell .pt{color:var(--ink);font-size:11px;overflow:hidden;text-overflow:ellipsis}.pcell .ps{font-size:10px;color:var(--dim)}
  .pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:2px}.pbar span{display:block;height:100%;background:var(--amber)}
  /* drawer */
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;position:sticky;top:0;max-height:100vh;display:none;padding:18px 20px 60px}
  .layout.open aside{display:block}
  aside h2{font:italic 24px/1.1 "Instrument Serif",serif;margin:0 0 2px}
  aside .close{float:right;cursor:pointer;color:var(--dim);font-size:18px;line-height:1}
  .sec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
  .sec .gl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:block}
  .gb{display:flex;gap:6px;flex-wrap:wrap}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 0}.stats b{color:var(--ink);font-size:14px;display:block}
  pre{white-space:pre-wrap;margin:6px 0 0;color:var(--dim);font-size:11px}
  .pkgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 0;font-size:12px;color:var(--dim)}.pkgrow b{color:var(--ink)}
  .pkgrow .btn{padding:3px 8px;font-size:11px}
  /* controls */
  .btn{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:2px;color:var(--ink);background:var(--panel2);text-decoration:none;font-size:12px;cursor:pointer;line-height:1.3}
  .btn:hover{border-color:var(--amber);color:var(--amber);text-decoration:none}
  .btn.amber{border-color:var(--amber);color:var(--amber)}.btn.blue{border-color:var(--blue);color:var(--blue)}
  .btn.red{color:var(--red)}.btn.red:hover{border-color:var(--red)}
  .btn.primary{background:var(--amber);color:#1b1608;border-color:var(--amber);font-weight:600}.btn.primary:hover{filter:brightness(1.08);color:#1b1608}
  .btn[disabled]{opacity:.4;pointer-events:none}
  button,input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:6px 10px}
  button{cursor:pointer}button:hover{border-color:var(--amber);color:var(--amber)}
  button.primary{background:var(--amber);color:#1b1608;border-color:var(--amber);font-weight:600}button.primary:hover{filter:brightness(1.08);color:#1b1608}
  a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
  input[type=checkbox]{padding:0;margin:0;accent-color:var(--amber)}
  .toast{position:fixed;right:24px;bottom:24px;background:var(--panel);border:1px solid var(--amber);padding:12px 16px;border-radius:3px;opacity:0;transform:translateY(8px);transition:.25s;z-index:9}
  .toast.show{opacity:1;transform:none}
  @media(max-width:1100px){.layout.open{grid-template-columns:1fr}.layout.open main{display:none}aside{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>GHL Vault<small>file exporter</small></h1>
  <div class="sp"></div>
  <span id="conn" class="dim" style="margin-right:12px;font-size:11px"></span>
  <a href="/search.html" style="color:var(--amber);margin-right:16px">master search →</a>
  <a href="/usage.html" style="color:var(--blue);margin-right:16px">usage analytics →</a>
  <a href="/logout" class="dim" style="margin-right:4px;font-size:11px">log out</a>
</header>
<div class="layout" id="layout">
<main>
  <div class="agency" id="backup">
    <div class="top">
      <span class="gl">Agency backup</span>
      <span id="bkStatus" class="dim" style="font-size:12px"></span>
      <span style="flex:1"></span>
      <a class="btn primary" id="bkConnect" href="/oauth/start" style="display:none">Connect agency app</a>
      <button class="btn" id="bkTest" title="Mint a sub-account token from the agency credential and read one contact page">Test credential</button>
      <button class="btn" id="importAgency2" title="Pull every sub-account under the agency into the vault">Import sub-accounts</button>
      <button class="btn primary" id="bkNow" title="Queue a backup for every enabled sub-account right now">Backup all now</button>
    </div>
    <div class="dim" id="bkLast" style="margin-top:6px;font-size:11px"></div>
    <details id="bkSched">
      <summary>Schedule &amp; sources</summary>
      <div>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bkEnabled"> monthly, on day</label>
        <input id="bkDay" type="number" min="1" max="28" style="width:62px;padding:4px 8px">
        <span>at</span><input id="bkHour" type="number" min="0" max="23" style="width:62px;padding:4px 8px"><span id="bkTz"></span>
        <select id="bkMode" style="padding:4px 8px"><option value="incremental">incremental (only what changed since last backup)</option><option value="full">full re-crawl</option></select>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bkImport"> import new sub-accounts first</label>
        <button class="btn" id="bkSave">Save schedule</button>
      </div>
      <div class="srcs" id="bkSrcs"><span>Backup sources:</span></div>
      <div class="srcs" id="srcs"><span>Sources for manual runs:</span></div>
    </details>
    <details>
      <summary>Add a location manually</summary>
      <div>
        <input id="locId" placeholder="Location ID" style="min-width:220px">
        <input id="locName" placeholder="Name (optional)" style="min-width:220px">
        <input id="locPit" placeholder="Private Integration Token (optional)" style="min-width:340px">
        <button class="primary" id="addLoc">Add / update</button>
      </div>
    </details>
  </div>

  <div id="overall"></div>
  <div class="chips" id="chips"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name or location ID…">
    <select id="sort">
      <option value="name">Sort: name</option>
      <option value="status">Sort: status</option>
      <option value="last">Sort: last run (newest)</option>
      <option value="contacts">Sort: contacts</option>
      <option value="files">Sort: files</option>
      <option value="bytes">Sort: size</option>
      <option value="failed">Sort: failed files</option>
    </select>
    <span class="sp"></span>
    <span id="count" class="dim" style="font-size:11px"></span>
    <button class="btn" id="retryAll" title="Resume every failed/cancelled job and retry failed files" style="display:none">Retry all failed</button>
    <button class="btn" id="runVisible" title="Queue a full export for every location in the current filter">Run export on filtered</button>
  </div>
  <table>
    <thead><tr>
      <th data-k="name" style="width:27%">Location</th>
      <th data-k="status" style="width:10%">Status</th>
      <th data-k="last" style="width:21%">Progress / last run</th>
      <th data-k="contacts" class="r" style="width:10%">Contacts</th>
      <th data-k="files" class="r" style="width:9%">Files</th>
      <th data-k="bytes" class="r" style="width:9%">Size</th>
      <th data-k="failed" class="r" style="width:8%">Failed</th>
      <th style="width:6%;cursor:default" title="Include in monthly backup">Backup</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="more" id="more"></div>
</main>
<aside id="drawer"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)};
const api=(p,o={})=>fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined}).then(r=>r.json());
const fmtB=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const fmtN=n=>Number(n||0).toLocaleString();
const fmtD=s=>s?new Date(s).toLocaleString():'—';
const ago=s=>{if(!s)return '—';const m=(Date.now()-new Date(s))/60000;if(m<1)return 'just now';if(m<60)return Math.round(m)+'m ago';if(m<1440)return Math.round(m/60)+'h ago';return Math.round(m/1440)+'d ago'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SOURCES=[];
async function loadSources(){SOURCES=await api('/api/sources');const box=$('#srcs');
  SOURCES.forEach(s=>{const l=document.createElement('label');l.innerHTML=`<input type=checkbox value="${s}" checked> ${s}`;box.appendChild(l)})}
const chosen=()=>[...document.querySelectorAll('#srcs input:checked')].map(i=>i.value);

// ---------- state ----------
const state={locs:[],filter:localStorage.vaultFilter||'all',q:'',sort:localStorage.vaultSort||'name',dir:1,page:1,sel:localStorage.vaultSel||null};
const PAGE=60;
$('#sort').value=state.sort;
const statusOf=l=>{const j=l.last_job;if(!j)return 'never';return j.status};
const STATUS_ORDER={failed:0,running:1,queued:2,cancelled:3,done:4,never:5};
function matches(l){
  const s=statusOf(l);
  switch(state.filter){
    case 'running':if(s!=='running')return false;break;
    case 'queued':if(s!=='queued')return false;break;
    case 'failed':if(s!=='failed'&&s!=='cancelled'&&!Number(l.files_failed))return false;break;
    case 'done':if(s!=='done')return false;break;
    case 'never':if(s!=='never')return false;break;
    case 'excluded':if(l.backup_enabled!==false)return false;break;
    case 'empty':if(s==='never'||Number(l.files_done))return false;break;
  }
  if(state.q){const q=state.q.toLowerCase();if(!(l.name||'').toLowerCase().includes(q)&&!l.location_id.toLowerCase().includes(q))return false}
  return true;
}
function sortVal(l,k){switch(k){
  case 'name':return (l.name||'~').toLowerCase();
  case 'status':return STATUS_ORDER[statusOf(l)]??9;
  case 'last':return -(new Date(l.last_job?.finished_at||l.last_job?.created_at||0).getTime());
  case 'contacts':return -Number(l.contacts);
  case 'files':return -Number(l.files_done);
  case 'bytes':return -Number(l.bytes);
  case 'failed':return -Number(l.files_failed)-(statusOf(l)==='failed'?1e12:0);
}}
function visible(){
  const rows=state.locs.filter(matches);
  rows.sort((a,b)=>{const x=sortVal(a,state.sort),y=sortVal(b,state.sort);return (x<y?-1:x>y?1:0)*state.dir||(a.name||'').localeCompare(b.name||'')});
  return rows;
}
function renderChips(){
  const L=state.locs,c=k=>L.filter(l=>{const s=statusOf(l);return k==='running'?s==='running':k==='queued'?s==='queued':k==='failed'?(s==='failed'||s==='cancelled'||Number(l.files_failed)):k==='done'?s==='done':k==='never'?s==='never':k==='excluded'?l.backup_enabled===false:k==='empty'?(s!=='never'&&!Number(l.files_done)):true}).length;
  const chips=[['all','all',''],['done','complete','green'],['running','running','amber'],['queued','queued','blue'],['failed','needs attention','red'],['never','never run',''],['empty','no files',''],['excluded','excluded from backup','']];
  $('#chips').innerHTML=chips.map(([k,label,cls])=>`<span class="chip ${cls} ${state.filter===k?'on':''}" data-filter="${k}"><b>${fmtN(c(k))}</b>${label}</span>`).join('');
  $('#retryAll').style.display=c('failed')?'':'none';
  // overall progress bar
  const n=L.length||1,segs=[['done',c('done'),'var(--green)'],['running',c('running'),'var(--amber)'],['queued',c('queued'),'var(--blue)'],['failed',L.filter(l=>['failed','cancelled'].includes(statusOf(l))).length,'var(--red)'],['never',c('never'),'var(--line)']];
  $('#overall').innerHTML=`<div class="obar">${segs.map(([k,v,col])=>v?`<span style="width:${v/n*100}%;background:${col}" title="${v} ${k}"></span>`:'').join('')}</div>
    <div class="dim" style="font-size:11px;margin-top:4px">${Math.round(c('done')/n*100)}% complete · ${segs.map(([k,v])=>`${fmtN(v)} ${k}`).join(' · ')}</div>`;
}
// progress for a running job: which source is active, how far along, with a bar when a ratio is known
function progCell(l){
  const p=l.last_job?.progress||{};const srcs=Object.keys(p);const doneN=srcs.filter(k=>p[k].status==='done').length;
  const act=srcs.find(k=>p[k].status&&p[k].status!=='done'&&p[k].status!=='pending')||srcs[doneN];
  const v=act?p[act]:null;let ratio=null,txt='starting…';
  if(v){
    if(v.candidatesTotal&&v.fetched!=null){ratio=v.fetched/v.candidatesTotal;txt=`${fmtN(v.fetched)}/${fmtN(v.candidatesTotal)} with docs`}
    else if(v.contactsSeen!=null){ratio=Number(l.contacts)?Math.min(v.contactsSeen/Number(l.contacts),1):null;txt=`${fmtN(v.contactsSeen)} contacts read`}
    else if(v.filesFound!=null)txt=`${fmtN(v.filesFound)} files found`;
    else if(v.fetched!=null)txt=`${fmtN(v.fetched)} fetched`;
    else txt=v.status||'…';
  }
  return `<div class="pcell"><span class="pt">${act||''} · ${txt}</span><span class="ps">${doneN}/${srcs.length} sources</span>${ratio!=null?`<div class="pbar"><span style="width:${Math.round(ratio*100)}%"></span></div>`:''}</div>`;
}
function renderTable(){
  const rows=visible();const box=$('#rows');
  const shown=rows.slice(0,PAGE*state.page);
  $('#count').textContent=`${fmtN(shown.length)} of ${fmtN(rows.length)} shown · ${fmtN(state.locs.length)} total`;
  const seen=new Set();let cursor=null;
  for(const l of shown){
    seen.add(l.location_id);
    const j=l.last_job,s=statusOf(l);
    const html=`<td><span class="name">${esc(l.name||'(unnamed)')}</span><span class="id">${l.location_id} · ${l.has_pit?'PIT':'agency'}</span></td>
      <td><span class="pill ${s}">${s}</span></td>
      <td class="dim" title="${j?fmtD(j.finished_at||j.created_at):''}">${s==='running'?progCell(l):j?`${ago(j.finished_at||j.created_at)} <span style="opacity:.6">#${j.id}${j.trigger==='scheduled'?' auto':j.since?' sync':''}</span>`:'—'}</td>
      <td class="r">${fmtN(l.contacts)}</td>
      <td class="r">${fmtN(l.files_done)}</td>
      <td class="r dim">${fmtB(l.bytes)}</td>
      <td class="r ${Number(l.files_failed)?'f':'dim'}">${Number(l.files_failed)?fmtN(l.files_failed):'·'}</td>
      <td style="text-align:center"><input type="checkbox" data-bk="${l.location_id}" ${l.backup_enabled!==false?'checked':''} onclick="event.stopPropagation()"></td>`;
    let tr=box.querySelector(`tr[data-loc="${l.location_id}"]`);
    if(!tr){tr=document.createElement('tr');tr.className='loc';tr.dataset.loc=l.location_id;tr.innerHTML=html;tr.dataset.html=html}
    else if(tr.dataset.html!==html){tr.innerHTML=html;tr.dataset.html=html}
    tr.classList.toggle('sel',state.sel===l.location_id);
    // keep DOM order in sync with sort
    if(cursor?cursor.nextSibling!==tr:box.firstChild!==tr)box.insertBefore(tr,cursor?cursor.nextSibling:box.firstChild);
    cursor=tr;
  }
  box.querySelectorAll('tr').forEach(r=>{if(!seen.has(r.dataset.loc))r.remove()});
  $('#more').innerHTML=rows.length>shown.length?`<button class="btn" id="moreBtn">Show ${Math.min(PAGE,rows.length-shown.length)} more (${fmtN(rows.length-shown.length)} remaining)</button>`:rows.length?'':'<span>No locations match.</span>';
  // sort header
  document.querySelectorAll('th[data-k]').forEach(th=>th.classList.toggle('sorted',th.dataset.k===state.sort));
}
let loading=false;
async function load(){
  if(loading)return;loading=true;
  try{const r=await fetch('/api/locations');if(!r.ok)throw new Error(r.status);const locs=await r.json();if(!Array.isArray(locs))throw new Error('bad payload');state.locs=locs;$('#conn').textContent=''}
  catch(e){$('#conn').textContent='reconnecting…';loading=false;return}
  renderChips();renderTable();if(state.sel)renderDrawer();
  loading=false;
}

// ---------- drawer ----------
function progText(j){return j?Object.entries(j.progress||{}).map(([k,v])=>`${k}: ${v.status||'…'}${v.contactsSeen!=null?` · ${fmtN(v.contactsSeen)} contacts read`:''}${v.candidatesTotal!=null?` · ${fmtN(v.candidatesTotal)} with docs`:''}${v.fetched!=null?` · ${fmtN(v.fetched)} fetched`:''}${v.filesFound!=null?` · ${fmtN(v.filesFound)} files found`:''}${v.users!=null?` · ${v.users} users`:''}${v.mode?` · mode=${v.mode}`:''} ${v.error?'✗ '+v.error:''}${v.note?' · '+v.note:''}`).join('\n'):''}
function renderDrawer(){
  const l=state.locs.find(x=>x.location_id===state.sel);const d=$('#drawer');
  if(!l){d.innerHTML='';$('#layout').classList.remove('open');return}
  $('#layout').classList.add('open');
  const j=l.last_job,running=j&&['running','queued'].includes(j.status),s=statusOf(l);
  const html=`<span class="close" id="closeDrawer" title="close">✕</span>
    <h2>${esc(l.name||'(unnamed)')}</h2>
    <div class="dim" style="font-size:11px;cursor:pointer" title="click to copy" data-copy="${l.location_id}">${l.location_id} · ${l.has_pit?'private token':'agency app'}</div>
    <div class="stats"><span>contacts<b>${fmtN(l.contacts)}</b></span><span>files<b>${fmtN(l.files_done)}</b></span><span>size<b>${fmtB(l.bytes)}</b></span>${Number(l.files_failed)?`<span class="f">failed<b class="f">${fmtN(l.files_failed)}</b></span>`:''}</div>
    <div class="sec"><span class="gl">Last run</span>
      ${j?`<span class="pill ${s}">${s}</span> <span class="dim">#${j.id}${j.trigger==='scheduled'?' · auto':j.since?' · sync':''} · ${fmtD(j.finished_at||j.created_at)}${j.sources?` · ${j.sources.join(', ')}`:''}</span><pre>${esc(progText(j))}</pre>`:'<span class="dim">never run</span>'}
    </div>
    <div class="sec"><span class="gl">Crawl GHL</span><div class="gb">
      ${running?`<button class="btn" data-cancel="${j.id}">Stop</button>`:`<button class="btn primary" data-run="${l.location_id}" title="Full crawl of the selected sources">Run export</button>${j&&j.status==='done'?`<button class="btn" data-sync="${l.location_id}" title="Only contacts updated since the last completed export">Sync new</button>`:''}`}
      ${j&&['cancelled','failed'].includes(j.status)?`<button class="btn" data-resume="${j.id}">Resume</button>`:''}
      ${j&&Number(l.files_failed)?`<button class="btn" data-retry="${j.id}">Retry failed files</button>`:''}
    </div></div>
    <div class="sec"><span class="gl">Analyze</span><div class="gb"><a class="btn amber" href="/analytics.html?loc=${l.location_id}">Documents</a><a class="btn blue" href="/usage.html?loc=${l.location_id}">Usage</a></div></div>
    <div class="sec"><span class="gl">Export</span><div class="gb"><a class="btn" href="/api/locations/${l.location_id}/export" title="Zip parts with contacts.csv + manifest + all documents, downloaded straight from R2">Download files</a><a class="btn" href="/api/locations/${l.location_id}/manifest.csv">Manifest CSV</a>${Number(l.files_failed)?`<a class="btn red" href="/api/locations/${l.location_id}/failures">Failures</a>`:''}</div></div>
    <div class="sec" id="pkgs"><span class="gl">Rep packages</span><div class="dim">loading…</div></div>
    <div class="sec"><span class="gl">Danger</span><div class="gb"><label class="dim" style="display:flex;gap:6px;align-items:center;margin-right:auto;cursor:pointer"><input type="checkbox" data-bk="${l.location_id}" ${l.backup_enabled!==false?'checked':''}> include in monthly backup</label><button class="btn red" data-reset="${l.location_id}">Reset data</button><button class="btn red" data-del="${l.location_id}">Delete location</button></div></div>`;
  if(d.dataset.html!==html){const pk=d.querySelector('#pkgs')?.innerHTML;d.innerHTML=html;if(pk&&d.dataset.loc===l.location_id)d.querySelector('#pkgs').innerHTML=pk;d.dataset.html=html}
  if(d.dataset.loc!==l.location_id||!d.dataset.pkgAt||Date.now()-d.dataset.pkgAt>8000){d.dataset.loc=l.location_id;d.dataset.pkgAt=Date.now();renderPackages(l.location_id)}
}
async function renderPackages(loc){
  const [pool,pkgs]=await Promise.all([api(`/api/locations/${loc}/pool`),api(`/api/packages?locationId=${loc}`)]);
  const el=$('#pkgs');if(!el||state.sel!==loc)return;
  const next=`<span class="gl">Rep packages · ${fmtN(pool.available)} of ${fmtN(pool.total)} contacts not yet packaged · random</span><div class="gb" style="margin-bottom:6px">
    ${pool.sizes.map(s=>`<button class="btn" data-pkg="${loc}" data-size="${s}" ${s>pool.available?'disabled title="not enough unpackaged contacts"':''}>${s>=1000?s/1000+'k':s}</button>`).join('')}<a class="btn amber" href="/analytics.html?loc=${loc}" title="Filter contacts, pick columns and documents, then package">Custom…</a></div>`+
    pkgs.map(p=>`<div class="pkgrow"><span class="pill ${p.status}">${p.status}</span><b>#${p.id}</b>${p.locked===false?'<span class="dim">export</span>':''}<span>${fmtN(p.contact_count)} contacts · ${p.status==='done'?fmtN(p.file_count)+' files':`${fmtN(p.progress.copied||0)}/${fmtN(p.progress.total||'?')} copied`}${p.progress.failed?` · <span class="f">${p.progress.failed} failed</span>`:''}</span>
      ${p.status==='done'?`<a class="btn" href="/api/packages/${p.id}/export">Files</a><a class="btn" href="/api/packages/${p.id}/contacts.csv">Contacts CSV</a><a class="btn" href="/api/packages/${p.id}/manifest.csv">Manifest</a>`:''}
      <button class="btn red" data-dissolve="${p.id}" title="${p.locked===false?'Delete this export record':'Release these contacts back into the pool'}">${p.locked===false?'remove':'dissolve'}</button></div>`).join('')||'<div class="dim" style="font-size:12px">none yet</div>';
  if(el.innerHTML!==next)el.innerHTML=next;
}

// ---------- events ----------
$('#q').oninput=e=>{state.q=e.target.value.trim();state.page=1;renderTable()};
$('#sort').onchange=e=>{state.sort=e.target.value;state.dir=1;localStorage.vaultSort=state.sort;renderTable()};
document.querySelector('thead').onclick=e=>{const th=e.target.closest('th[data-k]');if(!th)return;if(state.sort===th.dataset.k)state.dir=-state.dir;else{state.sort=th.dataset.k;state.dir=1}$('#sort').value=state.sort;localStorage.vaultSort=state.sort;renderTable()};
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;state.filter=c.dataset.filter;state.page=1;localStorage.vaultFilter=state.filter;renderChips();renderTable()};
$('#more').onclick=e=>{if(e.target.id==='moreBtn'){state.page++;renderTable()}};
$('#rows').onclick=e=>{const tr=e.target.closest('tr.loc');if(!tr||e.target.closest('input'))return;state.sel=state.sel===tr.dataset.loc?null:tr.dataset.loc;localStorage.vaultSel=state.sel||'';renderTable();renderDrawer()};
$('#retryAll').onclick=async()=>{
  const targets=state.locs.filter(l=>{const s=statusOf(l);return s==='failed'||s==='cancelled'||Number(l.files_failed)});
  if(!confirm(`Resume/retry ${targets.length} location(s) that failed or have failed files?`))return;
  let n=0;for(const l of targets){const j=l.last_job;if(!j)continue;if(['failed','cancelled'].includes(j.status))await api(`/api/jobs/${j.id}/resume`,{method:'POST'});else if(Number(l.files_failed))await api(`/api/jobs/${j.id}/retry-failed`,{method:'POST'});n++}
  toast(`Queued ${n}`);load()};
$('#runVisible').onclick=async()=>{
  const targets=visible().filter(l=>!['running','queued'].includes(statusOf(l)));
  if(!targets.length)return toast('Nothing to run');
  if(!confirm(`Queue a full export (${chosen().join(', ')}) for ${targets.length} location(s)?`))return;
  for(const l of targets)await api('/api/jobs',{method:'POST',body:{locationId:l.location_id,sources:chosen()}});
  toast(`Queued ${targets.length}`);load()};
document.addEventListener('change',async e=>{const c=e.target.closest('input[data-bk]');if(c){await api(`/api/locations/${c.dataset.bk}/backup-enabled`,{method:'POST',body:{enabled:c.checked}});toast(c.checked?'Included in backups':'Excluded from backups');load()}});
document.addEventListener('click',async e=>{
  const cp=e.target.closest('[data-copy]');if(cp){navigator.clipboard.writeText(cp.dataset.copy);toast('Copied');return}
  if(e.target.id==='closeDrawer'){state.sel=null;localStorage.vaultSel='';renderTable();renderDrawer();return}
  const pb=e.target.closest('button[data-pkg]');
  if(pb){const r=await api(`/api/locations/${pb.dataset.pkg}/packages`,{method:'POST',body:{size:Number(pb.dataset.size)}});toast(r.error||`Package #${r.id} queued (${r.contact_count} contacts)`);renderPackages(pb.dataset.pkg);return}
  const db=e.target.closest('button[data-dissolve]');
  if(db){if(!confirm('Release this package\'s contacts back into the pool?'))return;await api(`/api/packages/${db.dataset.dissolve}`,{method:'DELETE'});toast('Dissolved');renderPackages(state.sel);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.run){await api('/api/jobs',{method:'POST',body:{locationId:b.dataset.run,sources:chosen()}});toast('Queued');load()}
  if(b.dataset.reset||b.dataset.del){
    const loc=b.dataset.reset||b.dataset.del, del=!!b.dataset.del;
    if(!confirm(`${del?'Delete this location and':'Reset'} all its jobs, file records, contacts and packages?`))return;
    const purgeR2=confirm('Also delete the files already copied into R2? (Cancel = keep them)');
    const r=await api(`/api/locations/${loc}${del?'':'/reset'}`,{method:del?'DELETE':'POST',body:{purgeR2}});
    toast(r.error||`${del?'Deleted':'Reset'}${purgeR2?` · ${r.r2Deleted} R2 objects removed`:''}`);if(del){state.sel=null;localStorage.vaultSel=''}load();return}
  if(b.dataset.sync){const r=await api('/api/jobs',{method:'POST',body:{locationId:b.dataset.sync,sources:chosen(),incremental:true}});toast(r.error||`Sync queued (since ${new Date(r.since).toLocaleString()})`);load()}
  if(b.dataset.cancel){await api(`/api/jobs/${b.dataset.cancel}/cancel`,{method:'POST'});toast('Stopping after current page');load()}
  if(b.dataset.resume){await api(`/api/jobs/${b.dataset.resume}/resume`,{method:'POST'});toast('Resumed');load()}
  if(b.dataset.retry){await api(`/api/jobs/${b.dataset.retry}/retry-failed`,{method:'POST'});toast('Retry queued');load()}
});
$('#addLoc').onclick=async()=>{const r=await api('/api/locations',{method:'POST',body:{locationId:$('#locId').value.trim(),name:$('#locName').value.trim(),pitToken:$('#locPit').value.trim()}});
  toast(r.error||r.warning||`Saved ${r.name||''}`);$('#locId').value=$('#locName').value=$('#locPit').value='';load()};

// ---------- agency panel ----------
async function loadBackup(){
  const b=await api('/api/backup');const s=b.schedule;
  if(!$('#bkSched').open){$('#bkEnabled').checked=!!s.enabled;$('#bkDay').value=s.day;$('#bkHour').value=s.hour;$('#bkMode').value=s.mode;$('#bkImport').checked=!!s.importFirst}
  $('#bkTz').textContent=b.tz;
  const box=$('#bkSrcs');if(!box.querySelector('label'))b.sources.forEach(x=>{const l=document.createElement('label');l.innerHTML=`<input type=checkbox value="${x}" ${s.sources.includes(x)?'checked':''}> ${x}`;box.appendChild(l)});
  $('#bkConnect').style.display=b.oauthReady?'':'none';$('#bkConnect').textContent=b.oauthConnected?'Reconnect agency app':'Connect agency app';
  const cred=b.oauthConnected?`agency app · company ${b.companyId||'?'}`:b.oauthReady?'<span class="f">app configured but not installed yet — click Connect agency app and approve it for your AGENCY</span>':b.credential?`<span class="f">${b.credential}</span>`:`<span class="f">no agency credential — create a private marketplace app, set GHL_CLIENT_ID + GHL_CLIENT_SECRET, redirect URL <code>${b.redirectUri}</code></span>`;
  const sched=s.enabled?`monthly day ${s.day} @ ${String(s.hour).padStart(2,'0')}:00 ${b.tz} · ${s.mode}`:'schedule off';
  $('#bkStatus').innerHTML=`${b.counts.enabled}/${b.counts.total} enabled · ${b.counts.backed_up} backed up${b.counts.in_progress?` · ${b.counts.in_progress} running`:''} · ${sched} · ${cred}`;
  const l=s.last;$('#bkLast').textContent=l?`Last run ${new Date(l.at).toLocaleString()} (${l.trigger}, ${l.mode}): ${l.queued} queued, ${l.skipped} busy${l.imported?.total!=null?`, ${l.imported.imported} new sub-accounts imported`:''}${l.imported?.error?' · import failed: '+l.imported.error:''}`:'No backup run yet.';
}
$('#bkSave').onclick=async()=>{const r=await api('/api/backup/schedule',{method:'POST',body:{enabled:$('#bkEnabled').checked,day:Number($('#bkDay').value),hour:Number($('#bkHour').value),mode:$('#bkMode').value,importFirst:$('#bkImport').checked,sources:[...document.querySelectorAll('#bkSrcs input:checked')].map(i=>i.value)}});toast(r.error||'Schedule saved');$('#bkSched').open=false;loadBackup()};
$('#bkNow').onclick=async()=>{if(!confirm('Queue a backup for every enabled sub-account now?'))return;const r=await api('/api/backup/run',{method:'POST',body:{}});toast(r.error||`Queued ${r.queued} sub-accounts`);loadBackup();load()};
$('#bkTest').onclick=async()=>{toast('Testing…');const r=await api('/api/backup/test',{method:'POST',body:{}});alert(r.ok?`OK — minted a token for ${r.location} and read contacts (${r.contacts} total)`:`FAILED\n\n${r.error}`)};
$('#importAgency2').onclick=async()=>{const r=await api('/api/locations/import-agency',{method:'POST'});toast(r.error||`${r.total} sub-accounts (${r.imported} new)`);loadBackup();load()};
if(new URLSearchParams(location.search).get('connected'))toast('Agency app connected');
loadSources();load();loadBackup();setInterval(load,8000);setInterval(loadBackup,30000);
</script>
</body>
</html>
