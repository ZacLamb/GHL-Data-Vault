<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHL Vault</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1210;--panel:#151a16;--line:#263029;--ink:#e6e9e4;--dim:#8a948c;--amber:#f2b33d;--green:#5fd38a;--red:#f06a5a;--blue:#6fb3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Mono",ui-monospace,monospace;
       background-image:radial-gradient(circle at 20% -10%,rgba(242,179,61,.08),transparent 45%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.025) 31px 32px)}
  header{display:flex;align-items:baseline;gap:18px;padding:28px 36px 14px;border-bottom:1px solid var(--line)}
  h1{font:italic 40px/1 "Instrument Serif",serif;margin:0;letter-spacing:-.01em}
  h1 small{font:12px "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-left:12px;vertical-align:middle}
  header .sp{flex:1}
  main{padding:20px 36px 60px;max-width:1240px}
  .row{display:grid;grid-template-columns:1.3fr 1.4fr 1fr 1fr 1.2fr 1.6fr;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .row.head{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom-color:var(--amber)}
  .row:not(.head):hover{background:rgba(255,255,255,.025)}
  .id{color:var(--dim);font-size:11px}
  .name{font-weight:600}
  .pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .pill.done{border-color:var(--green);color:var(--green)}.pill.running{border-color:var(--amber);color:var(--amber);animation:blink 1.2s infinite}
  .pill.failed{border-color:var(--red);color:var(--red)}.pill.queued{border-color:var(--blue);color:var(--blue)}
  @keyframes blink{50%{opacity:.45}}
  button,input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:7px 11px}
  button{cursor:pointer;transition:border-color .15s,color .15s}button:hover{border-color:var(--amber);color:var(--amber)}
  button.primary{background:var(--amber);color:#1b1608;border-color:var(--amber);font-weight:600}button.primary:hover{filter:brightness(1.08);color:#1b1608}
  a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .add{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 26px;padding:16px;border:1px dashed var(--line);border-radius:3px}
  .add input{min-width:220px}
  .toast{position:fixed;right:24px;bottom:24px;background:var(--panel);border:1px solid var(--amber);padding:12px 16px;border-radius:3px;opacity:0;transform:translateY(8px);transition:.25s}
  .toast.show{opacity:1;transform:none}
  details{margin-top:6px;color:var(--dim);font-size:11px}pre{white-space:pre-wrap;margin:6px 0 0;color:var(--dim)}
  .stat b{color:var(--ink)}.stat .f{color:var(--red)}
  .srcs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;color:var(--dim);font-size:12px}
  .srcs label{display:flex;gap:4px;align-items:center;cursor:pointer}
  @media(max-width:900px){.row{grid-template-columns:1fr 1fr;gap:8px}.row.head{display:none}}
</style>
</head>
<body>
<header>
  <h1>GHL Vault<small>file exporter</small></h1>
  <div class="sp"></div>
  <button id="importAgency" title="Pull every sub-account via the agency token">Import sub-accounts</button>
</header>
<main>
  <div class="add">
    <input id="locId" placeholder="Location ID">
    <input id="locName" placeholder="Name (optional)">
    <input id="locPit" placeholder="Private Integration Token (optional)" style="min-width:340px">
    <button class="primary" id="addLoc">Add / update location</button>
  </div>
  <div class="srcs" id="srcs"><span>Sources for new runs:</span></div>
  <div class="row head"><div>Location</div><div>Last run</div><div>Files</div><div>Size</div><div>Downloads</div><div>Actions</div></div>
  <div id="rows"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)};
const api=(p,o={})=>fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined}).then(r=>r.json());
const fmtB=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const fmtD=s=>s?new Date(s).toLocaleString():'—';
let SOURCES=[];
async function loadSources(){SOURCES=await api('/api/sources');const box=$('#srcs');
  SOURCES.forEach(s=>{const l=document.createElement('label');l.innerHTML=`<input type=checkbox value="${s}" checked> ${s}`;box.appendChild(l)})}
const chosen=()=>[...document.querySelectorAll('#srcs input:checked')].map(i=>i.value);
async function load(){
  const locs=await api('/api/locations');const box=$('#rows');box.innerHTML='';
  if(!locs.length){box.innerHTML='<div class="row"><div class="id">No locations yet — add one above or import the agency.</div></div>';return}
  for(const l of locs){
    const j=l.last_job;const prog=j?Object.entries(j.progress||{}).map(([k,v])=>`${k}: ${v.status||'…'} ${v.filesFound!=null?`(${v.filesFound} found)`:''} ${v.error?'✗ '+v.error:''}${v.note?' · '+v.note:''}`).join('\n'):'';
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`
      <div><div class="name">${l.name||'(unnamed)'}</div><div class="id">${l.location_id} ${l.has_pit?'· PIT':'· agency'}</div></div>
      <div>${j?`<span class="pill ${j.status}">${j.status}</span> <span class="id">#${j.id} ${fmtD(j.finished_at||j.created_at)}</span>${prog?`<details><summary>progress</summary><pre>${prog}</pre></details>`:''}`:'<span class="id">never run</span>'}</div>
      <div class="stat"><b>${l.files_done}</b> done${Number(l.files_failed)?` · <span class="f">${l.files_failed} failed</span>`:''}</div>
      <div>${fmtB(l.bytes)}</div>
      <div class="actions"><a href="/api/locations/${l.location_id}/manifest.csv">manifest.csv</a><a href="/api/locations/${l.location_id}/export.zip">export.zip</a></div>
      <div class="actions"><button class="primary" data-run="${l.location_id}">Run export</button>${j&&Number(l.files_failed)?`<button data-retry="${j.id}">Retry failed</button>`:''}</div>`;
    box.appendChild(d);
  }
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.run){await api('/api/jobs',{method:'POST',body:{locationId:b.dataset.run,sources:chosen()}});toast('Queued');load()}
  if(b.dataset.retry){await api(`/api/jobs/${b.dataset.retry}/retry-failed`,{method:'POST'});toast('Retry queued');load()}
});
$('#addLoc').onclick=async()=>{const r=await api('/api/locations',{method:'POST',body:{locationId:$('#locId').value.trim(),name:$('#locName').value.trim(),pitToken:$('#locPit').value.trim()}});
  toast(r.error||r.warning||`Saved ${r.name||''}`);$('#locId').value=$('#locName').value=$('#locPit').value='';load()};
$('#importAgency').onclick=async()=>{const r=await api('/api/locations/import-agency',{method:'POST'});toast(r.error||`Imported ${r.imported} locations`);load()};
loadSources();load();setInterval(load,8000);
</script>
</body>
</html>
