<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Vault · RGS Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/ui/rgs-shell.js"></script>
<link rel="stylesheet" href="/ui/rgs-ui.css">
<link rel="stylesheet" href="/vault.css">
<script src="/vault.js"></script>
<style>
  @media (min-width: 1101px) { .split.has-insp { grid-template-columns: minmax(0, 1fr) 380px; } }
  .storage { padding: 16px 18px 14px; margin-bottom: 22px; }
  .storage .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .storage .top b { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .storage .top .sec { margin-left: auto; }
  .storage .meter { margin-top: 14px; }
  .storage .meter i:first-child { border-radius: 6px 0 0 6px; } .storage .meter i:last-child { border-radius: 0 6px 6px 0; }
  .storage .lg2 { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--sec); }
  .storage .lg2 span { display: inline-flex; align-items: center; gap: 6px; }
  .storage .lg2 .dot { border-radius: 3px; width: 10px; height: 10px; }
  .storage .lg2 b { color: var(--text); font-weight: 550; font-variant-numeric: tabular-nums; }
  .chips { margin-bottom: 18px; }
  @media (max-width: 600px) { .storage .top .sec { margin-left: 0; } }
  .is-empty #overall, .is-empty #chips, .is-empty #listGh { display: none; }
  .chip .dot { width: 7px; height: 7px; }
  .li.off > .av { opacity: .45; } .li.off .main b { color: var(--sec); }
  .li .main .sub .w { color: var(--orange); }
  .li.sel .main .sub .w { color: #fff; }
  .more { text-align: center; margin: -10px 0 22px; }
  .skrow { display: flex; gap: 12px; align-items: center; padding: 12px 14px; } .skrow .av { background: var(--fill); box-shadow: none; }

  /* inspector */
  .insp-hero .av.xl { width: 62px; height: 62px; border-radius: 16px; font-size: 22px; margin: 0 auto 12px; }
  .insp-hero .id { font-size: 11.5px; color: var(--ter); margin-top: 4px; display: inline-block; }
  .qa { flex-wrap: wrap; }
  .insp .grp { margin-bottom: 18px; }
  .insp .gh { padding-left: 4px; padding-right: 4px; }
  .insp .note { margin-bottom: 14px; }
  .insp .chips { margin: 0 0 10px; }
  .insp .chip:disabled { opacity: .4; cursor: default; }
  .li.stack { flex-wrap: wrap; row-gap: 6px; }
  .li.stack .sub { white-space: normal; }
  .li.stack .acts { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; padding-left: 40px; }
  .li .danger-t { color: var(--red); }
  .fr .lbl b { font-weight: 550; display: block; } .fr .lbl .sec { font-size: 12px; }
  .fr.click { cursor: pointer; } .fr.click:hover { background: var(--hover); }
  .issues { font: 11.5px/1.45 var(--mono); color: var(--sec); white-space: pre-wrap; max-height: 160px; overflow: auto; margin-top: 6px; }
  .preview-fields .li { min-height: 38px; }
</style>
</head>
<body>
  <div class="toolbar-top">
    <div class="seg" id="nav"></div>
    <span class="spacer"></span>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search sub-accounts" autocomplete="off"><span class="kbd">/</span></div>
    <span class="menu-wrap"><button class="icon-btn" id="moreBtn" title="More" aria-label="More actions"></button><div class="menu" id="moreMenu"></div></span>
  </div>

  <div class="split" id="split">
    <div class="wrap">
      <div class="page-head">
        <div><h1>Data Vault</h1><p id="pagesub">Everything GHL's export leaves behind, kept safe in your own storage</p></div>
        <div class="actions">
          <button class="btn tinted" id="schedBtn"></button>
          <button class="btn lg" id="bkNow" title="Back up every sub-account that's in the monthly backup, right now"></button>
        </div>
      </div>
      <div id="notes"></div>
      <div id="overall"></div>
      <div class="chips" id="chips"></div>
      <div class="gh" id="listGh"><span id="listTitle">Sub-accounts</span><span class="end"><select class="mini" id="sort" aria-label="Sort">
        <option value="name">Sorted by name</option><option value="status">Sorted by status</option><option value="last">Sorted by last backup</option>
        <option value="contacts">Sorted by contacts</option><option value="files">Sorted by files</option><option value="bytes">Sorted by size</option><option value="failed">Sorted by problems</option>
      </select></span></div>
      <div class="grp card" id="rows"></div>
      <div class="more" id="more"></div>
    </div>
    <aside class="insp" id="insp"></aside>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const { esc, api, N, fmtB, short, DT, when, ago, srcName } = V;
  let I = () => '';

  // ---------- state ----------
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
  const state = { locs: null, filter: ls('vaultFilter') || 'all', q: '', sort: ls('vaultSort') || 'name', dir: 1, page: 1, sel: ls('vaultSel') || null, backup: null, sources: [], manual: null };
  const PAGE = 60;
  if (window.innerWidth <= 1100) state.sel = null;   // don't pop the inspector sheet open on phones
  $('sort').value = state.sort;

  const statusOf = (l) => { if (l.inactive) return 'inactive'; const j = l.last_job; if (!j) return 'never'; if (j.status === 'queued' && j.not_before && new Date(j.not_before) > Date.now()) return 'parked'; return j.status; };
  const STATUS_ORDER = { failed: 0, running: 1, parked: 2, queued: 3, cancelled: 4, done: 5, never: 6, inactive: 7 };
  const FILTERS = {
    all: ['All', null, () => true],
    done: ['Backed up', 'var(--green)', (l, s) => s === 'done'],
    running: ['Backing up', 'var(--blue)', (l, s) => s === 'running'],
    queued: ['Waiting', 'var(--teal)', (l, s) => s === 'queued' || s === 'parked'],
    failed: ['Needs a look', 'var(--orange)', (l, s) => !l.inactive && (s === 'failed' || s === 'cancelled' || Number(l.files_failed) > 0)],
    never: ['Not backed up yet', 'var(--ter)', (l, s) => s === 'never'],
    inactive: ['Paused in GHL', 'var(--gray)', (l, s) => s === 'inactive'],
    empty: ['No files', null, (l, s) => s !== 'never' && !Number(l.files_done)],
    excluded: ['Left out of monthly backup', null, (l) => l.backup_enabled === false],
  };
  const matches = (l) => {
    const s = statusOf(l);
    if (!(FILTERS[state.filter] || FILTERS.all)[2](l, s)) return false;
    if (state.q) { const q = state.q.toLowerCase(); if (!(l.name || '').toLowerCase().includes(q) && !l.location_id.toLowerCase().includes(q)) return false; }
    return true;
  };
  function sortVal(l, k) {
    switch (k) {
      case 'name': return (l.name || '~').toLowerCase();
      case 'status': return STATUS_ORDER[statusOf(l)] ?? 9;
      case 'last': return -(new Date(l.last_job?.finished_at || l.last_job?.created_at || 0).getTime());
      case 'contacts': return -Number(l.contacts);
      case 'files': return -Number(l.files_done);
      case 'bytes': return -Number(l.bytes);
      case 'failed': return -Number(l.files_failed) - (statusOf(l) === 'failed' ? 1e12 : 0);
    }
  }
  function visible() {
    const rows = (state.locs || []).filter(matches);
    rows.sort((a, b) => { const x = sortVal(a, state.sort), y = sortVal(b, state.sort); return (x < y ? -1 : x > y ? 1 : 0) * state.dir || (a.name || '').localeCompare(b.name || ''); });
    return rows;
  }
  const manualSources = () => state.manual || state.sources;

  // ---------- running-job progress ----------
  function progInfo(l) {
    const p = l.last_job?.progress || {}; const srcs = Object.keys(p);
    const doneN = srcs.filter((k) => p[k].status === 'done').length;
    const act = srcs.find((k) => p[k].status && p[k].status !== 'done' && p[k].status !== 'pending') || srcs[doneN];
    const v = act ? p[act] : null; let ratio = null, txt = 'starting';
    if (v) {
      if (v.candidatesTotal && v.fetched != null) { ratio = v.fetched / v.candidatesTotal; txt = `${N(v.fetched)} of ${N(v.candidatesTotal)} with files`; }
      else if (v.contactsSeen != null) { ratio = Number(l.contacts) ? Math.min(v.contactsSeen / Number(l.contacts), 1) : null; txt = `${N(v.contactsSeen)} contacts read`; }
      else if (v.filesFound != null) txt = `${N(v.filesFound)} files found`;
      else if (v.fetched != null) txt = `${N(v.fetched)} saved`;
      else txt = v.status || 'working';
    }
    const last = Math.max(0, ...srcs.map((k) => (p[k].at ? new Date(p[k].at).getTime() : 0)));
    const silent = last ? (Date.now() - last) / 60000 : null;
    return { act, txt, ratio, doneN, total: srcs.length, silent };
  }

  // ---------- one row ----------
  function rowHtml(l) {
    const s = statusOf(l), j = l.last_job, ff = Number(l.files_failed);
    let sub, end;
    const st = (cls, icon, label) => `<span class="st ${cls}">${I(icon)}<span class="hide-sm">${label}</span></span>`;
    if (s === 'running') {
      const p = progInfo(l);
      sub = `Backing up${p.act ? ' · ' + esc(srcName(p.act)) : ''} · ${p.txt}${p.silent != null && p.silent > 15 ? ` · <span class="w">no progress for ${Math.round(p.silent)}m</span>` : ''}`;
      end = p.ratio != null ? `<span class="prog"><i style="width:${Math.round(p.ratio * 100)}%"></i></span><span class="pct">${Math.round(p.ratio * 100)}%</span>` : `<span class="spin"></span><span class="st run hide-sm">Step ${Math.min(p.doneN + 1, p.total)} of ${p.total}</span>`;
    } else if (s === 'parked') {
      sub = `Reached GHL's daily limit · continues ${DT(j.not_before)}`; end = st('warn', 'clock', 'Paused');
    } else if (s === 'queued') {
      sub = `Waiting to start${j.trigger === 'scheduled' ? ' · monthly backup' : ''}`; end = st('wait', 'clock', 'Waiting');
    } else if (s === 'failed' || s === 'cancelled') {
      sub = `${s === 'failed' ? 'Stopped with a problem' : 'Stopped'} · ${when(j.finished_at || j.created_at)}${Number(l.files_done) ? ' · ' + fmtB(l.bytes) : ''}`; end = st('warn', 'alert', 'Needs a look');
    } else if (s === 'done') {
      sub = `${when(j.finished_at || j.created_at)} · ${fmtB(l.bytes)} · ${N(l.files_done)} files`;
      if (ff) { sub += ` · <span class="w">${N(ff)} couldn't be saved</span>`; end = st('warn', 'alert', 'Needs a look'); } else end = st('ok', 'check', 'Backed up');
    } else if (s === 'inactive') {
      sub = 'Paused or turned off in GHL'; end = st('off', 'pause', 'Skipped');
    } else {
      sub = 'Not backed up yet'; end = l.backup_enabled === false ? st('off', 'pause', 'Skipped') : st('off', 'clock', 'Not yet');
    }
    if (l.backup_enabled === false && s !== 'inactive') sub += ' · left out of monthly backup';
    return `${RGS.avatarHtml(l.name || l.location_id)}<div class="main"><b>${esc(l.name || 'Unnamed sub-account')}</b><span class="sub">${sub}</span></div><span class="end">${end}<span class="chev">${I('right')}</span></span>`;
  }

  // ---------- overview ----------
  function renderOverview() {
    const L = state.locs || [];
    const cnt = (k) => L.filter((l) => FILTERS[k][2](l, statusOf(l))).length;
    const bytes = L.reduce((a, l) => a + Number(l.bytes || 0), 0), files = L.reduce((a, l) => a + Number(l.files_done || 0), 0), contacts = L.reduce((a, l) => a + Number(l.contacts || 0), 0);
    const n = L.length || 1;
    const bad = L.filter((l) => ['failed', 'cancelled'].includes(statusOf(l))).length;
    const segs = [['Backed up', L.filter((l) => statusOf(l) === 'done').length, 'var(--green)'], ['Backing up', cnt('running'), 'var(--blue)'], ['Waiting', cnt('queued'), 'var(--teal)'],
      ['Stopped', bad, 'var(--orange)'], ['Not yet', cnt('never'), 'var(--ter)'], ['Paused in GHL', cnt('inactive'), 'var(--gray)']];
    $('overall').innerHTML = `<div class="grp card storage">
        <div class="top"><b>${fmtB(bytes)} backed up</b><span class="sec">${N(L.length)} sub-account${L.length === 1 ? '' : 's'} · ${short(files)} files · ${short(contacts)} contacts</span></div>
        <div class="meter lg">${segs.map(([k, v, c]) => (v ? `<i style="width:${(v / n) * 100}%;background:${c}" title="${N(v)} ${k.toLowerCase()}"></i>` : '')).join('')}</div>
        <div class="lg2">${segs.filter((x) => x[1]).map(([k, v, c]) => `<span><i class="dot" style="background:${c}"></i>${k} <b>${N(v)}</b></span>`).join('')}</div>
      </div>${scheduleFoot()}`;
    const fbtn = $('overall').querySelector('[data-open-sched]'); if (fbtn) fbtn.onclick = (e) => { e.preventDefault(); openSchedule(); };
    $('chips').innerHTML = Object.entries(FILTERS).map(([k, [label, color]]) => { const c = cnt(k); if (!c && k !== 'all' && state.filter !== k) return ''; return `<button class="chip${state.filter === k ? ' on' : ''}" data-filter="${k}">${color ? `<i class="dot" style="background:${color}"></i>` : ''}${label} <span class="n">${N(c)}</span></button>`; }).join('');
    renderMenu();
  }
  function scheduleFoot() {
    const b = state.backup; if (!b) return '';
    const s = b.schedule, l = s.last;
    const hr = new Date(2000, 0, 1, s.hour).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const sched = s.enabled ? `Backs up on day ${s.day} of every month at ${hr} (${esc(b.tz)}) · ${s.mode === 'full' ? 'everything again' : 'only what changed'}` : 'Monthly backup is off';
    const last = l ? ` · last run ${DT(l.at)} (${l.trigger === 'scheduled' ? 'monthly' : 'by you'}): ${N(l.queued)} started${l.skipped ? `, ${N(l.skipped)} already busy` : ''}${l.imported?.total != null ? `, ${N(l.imported.imported)} new sub-accounts added` : ''}${l.imported?.elsewhere ? `, ${N(l.imported.elsewhere)} in another account's vault` : ''}${l.imported?.error ? ` · couldn't add new sub-accounts: ${esc(l.imported.error)}` : ''}` : '';
    return `<div class="foot">${sched}${last} · <a href="#" data-open-sched>Change</a></div>`;
  }
  function renderNotes() {
    const b = state.backup; if (!b) return;
    const notIn = b.connected.filter((c) => !c.inVault);
    let html = '';
    if (!b.connected.length) html = `<div class="note warn">${I('link')}<span>No sub-accounts are connected to your account yet. Connect them on the hub, then add them here.</span><a class="btn sm act" href="${esc((b.hubUrl || V.HUB) + '/app#connect')}">Connect</a></div>`;
    else if (notIn.length && (state.locs || []).length) html = `<div class="note">${I('info')}<span>${N(notIn.length)} connected sub-account${notIn.length === 1 ? " isn't" : "s aren't"} in the vault yet.</span><button class="btn sm tinted act" data-act="add">Add</button></div>`;
    const o = state.orphans || [];
    if (o.length) html = `<div class="note warn">${I('alert')}<span><b>${N(o.length)} sub-account${o.length === 1 ? '' : 's'} from before the hub ${o.length === 1 ? "isn't" : "aren't"} linked to your account</b>, so ${o.length === 1 ? "it's" : "they're"} hidden here. ${o.length === 1 ? 'Its backup is' : 'Their backups are'} safe: ${o.slice(0, 4).map((x) => esc(x.name || x.location_id)).join(', ')}${o.length > 4 ? ` and ${N(o.length - 4)} more` : ''}.</span><button class="btn sm act" data-act="linkOrphans">Link them</button></div>` + html;
    $('notes').innerHTML = html;
  }
  async function loadOrphans() {
    const r = await fetch('/api/orphans', { credentials: 'same-origin' }).catch(() => null);
    if (!r || !r.ok) return; const d = await r.json().catch(() => null);
    if (Array.isArray(d)) { state.orphans = d; renderNotes(); }
  }
  async function linkOrphans() {
    const o = state.orphans || []; if (!o.length) return;
    const box = V.openSheet(`${V.head('link', '--t-cyan', 'Link sub-accounts from before the hub', `${N(o.length)} sub-account${o.length === 1 ? '' : 's'}`)}
      <div class="sheet-bd"><p class="sec">Each saved token is moved from the vault's server to the hub and checked with GHL. Nothing goes through your browser. Backups stay exactly as they are.</p>
      <div style="text-align:center;padding:18px"><span class="spin"></span></div></div>`);
    const r = await api('/api/orphans/link', { method: 'POST' });
    if (r.error) { box.querySelector('.sheet-bd').innerHTML = `<p class="err">${esc(r.error)}</p>`; return; }
    const hub = (state.backup && state.backup.hubUrl) || V.HUB;
    box.querySelector('.sheet-bd').innerHTML = `
      ${r.linked.length ? `<div class="gh">Linked · ${N(r.linked.length)}</div><div class="grp">${r.linked.map((x) => `<div class="li"><div class="main"><b>${esc(x.name || x.location_id)}</b></div><span class="end"><span class="pill ok">Back in the vault</span></span></div>`).join('')}</div>` : ''}
      ${r.needToken.length ? `<div class="gh">Need a new token · ${N(r.needToken.length)}</div>
        <p class="sec" style="margin-bottom:8px">Connect these on the hub with their Location ID and a Private Integration Token, then press Add here. Their old backups attach again automatically.</p>
        <div class="grp">${r.needToken.map((x) => `<div class="li"><div class="main"><b>${esc(x.name || 'Unnamed sub-account')}</b><span class="sub mono" data-copy="${esc(x.location_id)}" data-what="Location ID" style="cursor:pointer">${esc(x.location_id)}</span><span class="sub">${esc(x.reason)}</span></div></div>`).join('')}</div>
        <div style="margin-top:12px"><a class="btn" href="${esc(hub)}/app#connect">Open Sub-accounts on the hub</a></div>` : ''}
      ${!r.linked.length && !r.needToken.length ? '<p class="sec">Nothing left to link.</p>' : ''}`;
    state.orphans = r.needToken.map((x) => ({ location_id: x.location_id, name: x.name }));
    renderNotes(); loading = false; load(); loadBackup();
  }

  // ---------- list ----------
  function renderList() {
    const box = $('rows');
    if (!state.locs) return;
    document.body.classList.toggle('is-empty', !state.locs.length);
    if (!state.locs.length) {
      box.className = '';
      box.innerHTML = `<div class="empty">${RGS.glyph('database', '--t-slate')}<b>Your vault is empty</b>Add the sub-accounts you want backed up. Their files, recordings and documents get copied to your own storage.
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn lg" data-act="importAll">Add all connected sub-accounts</button><button class="btn tinted lg" data-act="add">Choose one</button></div></div>`;
      $('more').innerHTML = ''; $('listTitle').textContent = 'Sub-accounts'; return;
    }
    box.className = 'grp card';
    const rows = visible(); const shown = rows.slice(0, PAGE * state.page);
    $('listTitle').textContent = rows.length === state.locs.length ? `Sub-accounts · ${N(rows.length)}` : `${N(rows.length)} of ${N(state.locs.length)} sub-accounts`;
    if (!rows.length) { box.innerHTML = `<div class="empty">${RGS.glyph('search', '--t-gray')}<b>No matches</b>${state.q ? `Nothing matches “${esc(state.q)}”.` : 'No sub-accounts in this group.'}</div>`; $('more').innerHTML = ''; return; }
    if (box.querySelector('.empty')) box.innerHTML = '';
    box.querySelectorAll('.skrow').forEach((e) => e.remove()); // loading placeholders
    const seen = new Set(); let cursor = null;
    for (const l of shown) {
      seen.add(l.location_id);
      const html = rowHtml(l);
      let el = box.querySelector(`.li[data-loc="${CSS.escape(l.location_id)}"]`);
      if (!el) { el = document.createElement('div'); el.className = 'li click'; el.dataset.loc = l.location_id; el.innerHTML = html; el.dataset.html = html; }
      else if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
      el.classList.toggle('sel', state.sel === l.location_id); el.classList.toggle('off', statusOf(l) === 'inactive');
      if (cursor ? cursor.nextSibling !== el : box.firstChild !== el) box.insertBefore(el, cursor ? cursor.nextSibling : box.firstChild);
      cursor = el;
    }
    box.querySelectorAll('.li[data-loc]').forEach((r) => { if (!seen.has(r.dataset.loc)) r.remove(); });
    $('more').innerHTML = rows.length > shown.length ? `<button class="btn tinted" id="moreRows">Show ${N(Math.min(PAGE, rows.length - shown.length))} more · ${N(rows.length - shown.length)} left</button>` : '';
  }
  function skeleton() {
    $('rows').innerHTML = Array.from({ length: 7 }, (_, i) => `<div class="skrow"><span class="av"></span><div style="flex:1"><div class="skel" style="width:${28 + (i * 13) % 30}%;margin-bottom:7px"></div><div class="skel" style="width:${40 + (i * 7) % 30}%;height:10px"></div></div></div>`).join('');
  }

  let loading = false;
  async function load() {
    if (loading) return; loading = true;
    try {
      const r = await fetch('/api/locations', { credentials: 'same-origin' });
      if (r.status === 401 || r.status === 402) { const d = await r.json().catch(() => ({})); if (d.login || d.subscribe) location.href = d.login || d.subscribe; return; }
      if (!r.ok) throw new Error(r.status); const locs = await r.json(); if (!Array.isArray(locs)) throw new Error('bad payload');
      state.locs = locs;
    } catch (e) {
      if (!state.locs) $('rows').innerHTML = `<div class="empty">${RGS.glyph('alert', '--t-orange')}<b>Couldn't load your vault</b>Trying again in a few seconds.</div>`;
      loading = false; return;
    }
    renderOverview(); renderNotes(); renderList(); if (state.sel) renderInsp();
    loading = false;
  }
  async function loadBackup() {
    const b = await api('/api/backup'); if (!b || b.error || !b.schedule) return;
    state.backup = b; state.sources = b.sources || [];
    if (!state.manual) { try { const m = JSON.parse(ls('vaultManualSrc') || 'null'); if (Array.isArray(m)) state.manual = m.filter((x) => state.sources.includes(x)); } catch {} }
    if (state.locs) { renderOverview(); renderNotes(); if (state.sel) renderInsp(); }
  }

  // ---------- inspector ----------
  const ins = { loc: null, jobs: [], pool: null, pkgs: [], pushes: [], at: 0, openJobs: new Set(), showAll: false };
  function selectLoc(id, { scroll } = {}) {
    state.sel = id; ls('vaultSel', id || '');
    document.querySelectorAll('#rows .li[data-loc]').forEach((el) => el.classList.toggle('sel', el.dataset.loc === id));

    const l = (state.locs || []).find((x) => x.location_id === state.sel); if (!l) return;
    const loc = encodeURIComponent(l.location_id), isPkg = scope.startsWith('package:'), pkg = isPkg ? ins.pkgs.find((p) => 'package:' + p.id === scope) : null;
    const sub = isPkg ? `${esc(l.name || l.location_id)} · package #${scope.slice(8)}${pkg ? ` · ${N(pkg.file_count)} files` : ''}` : `${esc(l.name || l.location_id)} · ${N(l.files_done)} files · ${fmtB(l.bytes)}`;
    let alive = true;
    const box = V.openSheet(`${V.head('download', '--t-blue', 'Download files', sub)}
      <div class="sheet-bd">
        <div class="gh">Zip files<span class="end"><a href="#" id="dlPrep">Prepare download</a></span></div>
        <div class="grp" id="dlParts"><div class="li flush sec"><span class="spin"></span>&nbsp;Loading…</div></div>
        <p class="sec" style="font-size:12px;margin:-14px 4px 18px">Files are zipped in your storage, then each part downloads straight from it. You can close this while it builds. ${isPkg ? 'Part 1 has contacts.csv and the file list.' : `<a href="/api/locations/${loc}/manifest.csv">File list (CSV)</a>`}</p>
        <div class="gh">Send to someone</div>
        <div class="grp"><div class="fr"><div class="lbl"><b>Link works for</b></div><div class="ctl"><select id="shDays" style="width:120px"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option></select></div></div>
          <div class="fr"><div class="lbl"><b>Password</b><span class="sec">Recommended</span></div><div class="ctl"><input type="password" id="shPw" placeholder="Optional" style="width:170px" autocomplete="new-password"></div></div></div>
        <div style="display:flex;justify-content:flex-end;margin:-12px 0 16px"><button class="btn tinted" id="shGo">${I('link')}Create link</button></div>
        <div id="shList"></div>
        <p class="sec" style="font-size:12px;margin:0 4px">Prefer a terminal? <a href="/api/locations/${loc}/export?scope=${encodeURIComponent(scope)}" target="_blank" rel="noopener">The classic download page</a> has the rclone command.</p>
      </div>
      <div class="sheet-ft"><button class="btn" data-close>Done</button></div>`, { onClose: () => { alive = false; } });
    async function parts() {
      const bs = await api(`/api/locations/${loc}/bundles?scope=${encodeURIComponent(scope)}`); if (!alive) return;
      const el = box.querySelector('#dlParts');
      if (!Array.isArray(bs)) { el.innerHTML = `<div class="li flush sec">${esc(bs.error || 'Couldn’t load')}</div>`; return; }
      el.innerHTML = bs.length ? bs.map((b) => `<div class="li flush">${RGS.glyph('file', '--t-gray')}<div class="main"><b>Part ${b.part} of ${b.total_parts}</b><span class="sub">${N(b.file_count)} files${b.bytes ? ' · ' + fmtB(b.bytes) : ''}${b.error ? ' · ' + esc(b.error) : ''}</span></div>
        <span class="end">${b.url ? `<a class="btn sm" href="${esc(b.url)}">Download</a>` : b.status === 'failed' ? '<span class="pill bad">Failed</span>' : b.status === 'running' ? '<span class="spin"></span><span class="sec">Zipping</span>' : '<span class="pill">Queued</span>'}</span></div>`).join('')
        : `<div class="li flush sec">Nothing prepared yet. Press Prepare download.</div>`;
      if (bs.some((b) => b.status !== 'done' && b.status !== 'failed')) setTimeout(() => alive && parts(), 5000);
    }
    async function shares() {
      const ss = await api(`/api/locations/${loc}/shares?scope=${encodeURIComponent(scope)}`); if (!alive || !Array.isArray(ss)) return;
      box.querySelector('#shList').innerHTML = ss.length ? `<div class="gh">Active links</div><div class="grp">${ss.map((s) => `<div class="code-box"><span class="mono">${esc(s.url)}</span><button class="icon-btn" data-sc="${esc(s.url)}" title="Copy link">${I('copy')}</button><button class="icon-btn" data-revoke="${esc(s.token)}" title="Turn off this link" style="color:var(--red)">${I('trash')}</button></div><div class="sec" style="font-size:12px;padding:0 14px 10px;margin-top:-4px">${s.protected ? 'Password protected · ' : ''}works until ${V.D(s.expires_at)}</div>`).join('')}</div>` : '';
      box.querySelectorAll('[data-sc]').forEach((b) => b.onclick = () => RGS.copy(b.dataset.sc, 'Link'));
      box.querySelectorAll('[data-revoke]').forEach((b) => b.onclick = async () => { await api('/api/shares/' + encodeURIComponent(b.dataset.revoke), { method: 'DELETE' }); RGS.toast('Link turned off'); shares(); });
    }
    box.querySelector('#dlPrep').onclick = async (e) => {
      e.preventDefault();
      const el = box.querySelector('#dlParts');
      if (el.querySelector('.btn, .pill') && !confirm('Build the zip files again? The current ones are replaced.')) return;
      const r = await api(`/api/locations/${loc}/bundles`, { method: 'POST', body: { scope } });
      if (r.error) return RGS.toast(r.error, { error: true });
      RGS.toast(`Preparing ${N(r.parts)} part${r.parts === 1 ? '' : 's'}`); parts();
    };
    box.querySelector('#shGo').onclick = async () => {
      const r = await api(`/api/locations/${loc}/shares`, { method: 'POST', body: { scope, days: Number(box.querySelector('#shDays').value), password: box.querySelector('#shPw').value } });
      if (r.error) return RGS.toast(r.error, { error: true });
      box.querySelector('#shPw').value = '';
      RGS.copy(r.url, 'Link');
      setTimeout(() => RGS.toast(r.protected ? 'Link copied. Send the password separately, by text or call.' : 'Link copied. No password, so anyone with it can download.'), 1900);
      shares();
    };
    parts(); shares();
  }

  async function openFailures() {
    const loc = state.sel; const l = (state.locs || []).find((x) => x.location_id === loc); if (!l) return;
    const box = V.openSheet(`${V.head('alert', '--t-orange', 'Files that couldn’t be saved', esc(l.name || loc))}<div class="sheet-bd" id="fBody"><div class="status"><span class="spin"></span>Loading…</div></div>
      <div class="sheet-ft">${l.last_job ? `<button class="btn tinted" id="fRetry" style="margin-right:auto">Try them again</button>` : ''}<button class="btn" data-close>Done</button></div>`, { wide: true });
    const r = await api(`/api/locations/${encodeURIComponent(loc)}/failures`);
    if (r.error) { box.querySelector('#fBody').innerHTML = `<div class="status err">${esc(r.error)}</div>`; return; }
    box.querySelector('#fBody').innerHTML = `${r.failures.length ? `<div class="grp">${r.failures.map((f) => `<div class="li flush"><div class="main"><b>${esc(f.error || 'Unknown problem')}</b><span class="sub">${esc(srcName(f.source || ''))}${f.field_name ? ' · ' + esc(f.field_name) : ''}${f.sample_url ? ` · <span class="mono">${esc(f.sample_url)}</span>` : ''}</span></div><span class="end"><span class="pill warn">${N(f.n)}</span></span></div>`).join('')}</div>` : '<p class="sec">Nothing failed.</p>'}
      <p class="sec" style="font-size:12px;margin:0 4px">${N(r.done?.done)} files saved${Number(r.done?.no_size) ? ` · ${N(r.done.no_size)} without a size` : ''}${r.skipped_no_recording ? ` · ${N(r.skipped_no_recording)} calls had no recording to save` : ''}.</p>`;
    const rt = box.querySelector('#fRetry'); if (rt) rt.onclick = async () => { const x = await api(`/api/jobs/${l.last_job.id}/retry-failed`, { method: 'POST' }); V.closeSheet(); RGS.toast(x.error || 'Trying them again', x.error ? { error: true } : {}); load(); };
  }

  const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
  function openPush(pkgId) {
    const loc = state.sel; const me = (state.locs || []).find((l) => l.location_id === loc); if (!me) return;
    const targets = state.locs.filter((l) => l.location_id !== loc && !l.inactive).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const pk = ins.pkgs.filter((p) => p.status === 'done');
    const box = V.openSheet(`${V.head('upload', '--t-cyan', 'Copy to another sub-account', `From ${esc(me.name || loc)}`)}
      <div class="sheet-bd">
        <div class="field"><label for="pushTarget">Copy into</label><select id="pushTarget"><option value="">Choose a sub-account</option>${targets.map((t) => `<option value="${esc(t.location_id)}">${esc(t.name || t.location_id)}</option>`).join('')}</select></div>
        <div class="field"><label for="pushScope">What to copy</label><select id="pushScope"><option value="all">Whole sub-account · ${N(me.contacts)} contacts</option>${pk.map((p) => `<option value="${p.id}"${String(p.id) === String(pkgId) ? ' selected' : ''}>Package #${p.id} · ${N(p.contact_count)} contacts</option>`).join('')}</select></div>
        <div class="field"><label for="pushTag">Tag added to copied contacts</label><input type="text" id="pushTag" value="vault-push:${esc(slug(me.name || loc))}"></div>
        <div class="grp">
          <div class="fr"><div class="lbl"><b>Documents</b></div><div class="ctl"><label class="sw"><input type="checkbox" id="pushDocs" checked><i></i></label></div></div>
          <div class="fr"><div class="lbl"><b>Custom field values</b></div><div class="ctl"><label class="sw"><input type="checkbox" id="pushCustom" checked><i></i></label></div></div>
          <div class="fr"><div class="lbl"><b>Opportunities</b><span class="sec">Pipelines are matched by name</span></div><div class="ctl"><label class="sw"><input type="checkbox" id="pushOpps"><i></i></label></div></div>
        </div>
        <p class="sec" style="font-size:12px;margin:-12px 4px 12px">Contacts are matched one by one, so copying again updates them instead of making duplicates.</p>
        <div id="pushPrev"></div>
      </div>
      <div class="sheet-ft"><span class="sec" id="pushMsg" style="margin-right:auto;align-self:center;font-size:12.5px"></span><button class="btn tinted" id="pushPreview">Preview</button><button class="btn" id="pushStart" disabled>Start copying</button></div>`, { wide: true });
    const body = () => { const scope = box.querySelector('#pushScope').value; return { targetLocationId: box.querySelector('#pushTarget').value, ...(scope === 'all' ? { sourceLocationId: loc } : { packageId: Number(scope) }), tag: box.querySelector('#pushTag').value.trim() || null, include: { documents: box.querySelector('#pushDocs').checked, customFields: box.querySelector('#pushCustom').checked, opportunities: box.querySelector('#pushOpps').checked } }; };
    box.querySelectorAll('select, input').forEach((x) => x.addEventListener('change', () => { box.querySelector('#pushStart').disabled = true; }));
    box.querySelector('#pushPreview').onclick = async () => {
      const b = body(); if (!b.targetLocationId) return RGS.toast('Choose where to copy into', { error: true });
      box.querySelector('#pushMsg').innerHTML = '<span class="spin" style="vertical-align:-2px"></span>&nbsp;Checking the fields there…';
      const r = await api('/api/pushes/preview', { method: 'POST', body: b });
      box.querySelector('#pushMsg').textContent = '';
      if (r.error) return RGS.toast(r.error, { error: true });
      const calls = r.contacts * 2 + r.files;
      box.querySelector('#pushPrev').innerHTML = `<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:12px"><div class="tile"><div class="k">Contacts</div><div class="v">${N(r.contacts)}</div></div><div class="tile"><div class="k">Documents</div><div class="v">${N(r.files)}</div></div><div class="tile"><div class="k">Size</div><div class="v">${fmtB(r.bytes)}</div></div>${b.include.opportunities ? `<div class="tile"><div class="k">Opportunities</div><div class="v">${N(r.opportunities)}</div></div>` : ''}</div>
        <p class="sec" style="font-size:12px;margin:0 4px 12px">About ${N(calls)} GHL requests in the target. GHL allows 200,000 a day, so this takes about ${Math.max(1, Math.ceil(calls / 200000))} day${calls > 200000 ? 's' : ''}.</p>
        ${r.fields.length ? `<div class="gh">Custom fields</div><div class="grp preview-fields">${r.fields.map((f) => `<div class="li flush"><div class="main"><b>${esc(f.name)}</b><span class="sub">${esc(f.kind)}</span></div><span class="end"><span class="pill ${/created/.test(f.target) ? 'blue' : /skipped/.test(f.target) ? 'warn' : ''}">${esc(f.target)}</span></span></div>`).join('')}</div>` : '<p class="sec" style="margin:0 4px">No custom fields involved.</p>'}`;
      box.querySelector('#pushStart').disabled = false;
    };
    box.querySelector('#pushStart').onclick = async () => {
      const b = body(); if (!b.targetLocationId) return RGS.toast('Choose where to copy into', { error: true });
      const r = await api('/api/pushes', { method: 'POST', body: b });
      if (r.error) return RGS.toast(r.error, { error: true });
      V.closeSheet(); RGS.toast(`Copy #${r.id} started`); ins.at = 0; renderInsp();
    };
  }

  // ---------- menu ----------
  function renderMenu() {
    const L = state.locs || [];
    const failed = L.filter((l) => FILTERS.failed[2](l, statusOf(l))).length;
    const runnable = visible().filter((l) => !l.inactive && !['running', 'queued'].includes(statusOf(l))).length;
    const hub = ((state.backup && state.backup.hubUrl) || V.HUB) + '/app#connect';
    $('moreMenu').innerHTML = `<button data-act="add">${I('plus')}<span>Add a sub-account…</span></button>
      <button data-act="importAll">${I('users')}<span>Add all connected sub-accounts</span></button>
      <button data-act="test">${I('shield')}<span>Check the GHL connection<small class="sec">Reads one contact page to make sure access works</small></span></button><hr>
      <button data-act="runVisible" ${runnable ? '' : 'disabled'}>${I('refresh')}<span>Back up the list below<small class="sec">Full backup of ${N(runnable)} shown sub-account${runnable === 1 ? '' : 's'}</small></span></button>
      <button data-act="retryAll" ${failed ? '' : 'disabled'}>${I('alert')}<span>Retry everything that needs a look<small class="sec">${N(failed)} sub-account${failed === 1 ? '' : 's'}</small></span></button><hr>
      <button data-act="schedule">${I('calendar')}<span>Backup schedule…</span></button>
      <a href="${esc(hub)}">${I('external')}<span>Connect sub-accounts on the hub</span></a>`;
  }
  const closeMenu = () => $('moreMenu').classList.remove('open');

  async function act(a) {
    closeMenu();
    if (a === 'add') return openAdd();
    if (a === 'importAll') return importAll();
    if (a === 'linkOrphans') return linkOrphans();
    if (a === 'schedule') return openSchedule();
    if (a === 'allJobs') { ins.showAll = !ins.showAll; const l = state.locs.find((x) => x.location_id === state.sel); if (l) renderHistory(l); return; }
    if (a === 'test') {
      RGS.toast('Checking…');
      const r = await api('/api/backup/test', { method: 'POST', body: {} });
      return r.ok ? RGS.toast(`Connection works: read ${esc(r.location)} (${N(r.contacts)} contacts)`) : RGS.toast(`Connection check failed: ${r.error || 'unknown problem'}`, { error: true });
    }
    if (a === 'runVisible') {
      const targets = visible().filter((l) => !l.inactive && !['running', 'queued'].includes(statusOf(l)));
      if (!targets.length) return RGS.toast('Nothing to back up', { error: true });
      const src = manualSources();
      if (!(await V.ask({ title: `Back up ${N(targets.length)} sub-account${targets.length === 1 ? '' : 's'}?`, body: `A full backup of ${src.map(srcName).join(', ')} for every sub-account in the list below.`, ok: 'Back up', icon: 'refresh', grad: '--t-blue' }))) return;
      for (const l of targets) await api('/api/jobs', { method: 'POST', body: { locationId: l.location_id, sources: src } });
      RGS.toast(`Started ${N(targets.length)}`); return load();
    }
    if (a === 'retryAll') {
      const targets = state.locs.filter((l) => FILTERS.failed[2](l, statusOf(l)));
      if (!(await V.ask({ title: `Retry ${N(targets.length)} sub-account${targets.length === 1 ? '' : 's'}?`, body: 'Stopped backups pick up where they left off, and files that couldn’t be saved are tried again.', ok: 'Retry', icon: 'refresh', grad: '--t-orange' }))) return;
      let n = 0;
      for (const l of targets) { const j = l.last_job; if (!j) continue; if (['failed', 'cancelled'].includes(j.status)) await api(`/api/jobs/${j.id}/resume`, { method: 'POST' }); else if (Number(l.files_failed)) await api(`/api/jobs/${j.id}/retry-failed`, { method: 'POST' }); n++; }
      RGS.toast(`Retrying ${N(n)}`); return load();
    }
  }

  // ---------- events ----------
  $('q').oninput = (e) => { state.q = e.target.value.trim(); state.page = 1; renderList(); renderMenu(); };
  $('sort').onchange = (e) => { state.sort = e.target.value; state.dir = 1; ls('vaultSort', state.sort); renderList(); };
  $('chips').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; state.filter = c.dataset.filter; state.page = 1; ls('vaultFilter', state.filter); renderOverview(); renderList(); };
  $('more').onclick = (e) => { if (e.target.id === 'moreRows') { state.page++; renderList(); } };
  $('moreBtn').onclick = (e) => { e.stopPropagation(); $('moreMenu').classList.toggle('open'); };
  $('schedBtn').onclick = () => openSchedule();
  $('bkNow').onclick = async () => {
    const n = state.backup?.counts?.enabled;
    if (!(await V.ask({ title: 'Back up everything now?', body: `Starts a backup for ${n != null ? N(n) + ' ' : 'every '}sub-account${n === 1 ? '' : 's'} in the monthly backup. Ones already running are left alone.`, ok: 'Back up now', icon: 'refresh', grad: '--t-blue' }))) return;
    const r = await api('/api/backup/run', { method: 'POST', body: {} });
    if (r.error) return RGS.toast(r.error, { error: true });
    RGS.toast(`Started ${N(r.queued)} sub-account${r.queued === 1 ? '' : 's'}`); loadBackup(); load();
  };
  $('insp').addEventListener('toggle', (e) => { const d = e.target; if (d.tagName !== 'DETAILS' || !d.dataset.job) return; const id = Number(d.dataset.job); if (d.open) ins.openJobs.add(id); else ins.openJobs.delete(id); const sm = d.querySelector('summary'); if (sm) sm.textContent = d.open ? 'Hide details' : 'Details'; $('iHist').dataset.html = ''; }, true);
  document.addEventListener('change', async (e) => {
    const c = e.target.closest('input[data-bk]'); if (!c) return;
    const r = await api(`/api/locations/${encodeURIComponent(c.dataset.bk)}/backup-enabled`, { method: 'POST', body: { enabled: c.checked } });
    if (r.error) { c.checked = !c.checked; return RGS.toast(r.error, { error: true }); }
    RGS.toast(c.checked ? 'In the monthly backup' : 'Left out of the monthly backup'); load(); loadBackup();
  });
  document.addEventListener('click', async (e) => {
    if (!e.target.closest('.menu-wrap')) closeMenu();
    const cp = e.target.closest('[data-copy]'); if (cp) { RGS.copy(cp.dataset.copy, cp.dataset.what || ''); return; }
    const a = e.target.closest('[data-act]'); if (a) { e.preventDefault(); if (!a.disabled) act(a.dataset.act); return; }
    if (e.target.id === 'inspClose') { selectLoc(null); return; }
    const row = e.target.closest('#rows .li[data-loc]'); if (row) { selectLoc(state.sel === row.dataset.loc ? null : row.dataset.loc); return; }
    if (e.target === $('split')) { selectLoc(null); return; }
    const dl = e.target.closest('[data-download]'); if (dl) { openDownload(dl.dataset.download); return; }
    if (e.target.closest('[data-failures]')) { openFailures(); return; }
    const pn = e.target.closest('[data-pushnew]'); if (pn) { e.preventDefault(); openPush(null); return; }
    const pp = e.target.closest('[data-pushpkg]'); if (pp) { openPush(pp.dataset.pushpkg); return; }
    const pb = e.target.closest('[data-pkg]');
    if (pb) {
      if (pb.disabled) return;
      const r = await api(`/api/locations/${encodeURIComponent(pb.dataset.pkg)}/packages`, { method: 'POST', body: { size: Number(pb.dataset.size) } });
      RGS.toast(r.error || `Package #${r.id} started with ${N(r.contact_count)} contacts`, r.error ? { error: true } : {}); ins.at = 0; renderInsp(); return;
    }
    const db = e.target.closest('[data-dissolve]');
    if (db) {
      const locked = db.dataset.locked === '1';
      if (!(await V.ask({ title: locked ? `Release package #${db.dataset.dissolve}?` : `Remove export #${db.dataset.dissolve}?`, body: locked ? 'Its contacts go back into the pool so they can be packaged again.' : 'This deletes the export record.', ok: locked ? 'Release' : 'Remove', danger: true }))) return;
      await api(`/api/packages/${db.dataset.dissolve}`, { method: 'DELETE' }); RGS.toast(locked ? 'Released' : 'Removed'); ins.at = 0; renderInsp(); return;
    }
    const pc = e.target.closest('[data-pushcancel]'); if (pc) { await api(`/api/pushes/${pc.dataset.pushcancel}/cancel`, { method: 'POST' }); RGS.toast('Stopping'); ins.at = 0; renderInsp(); return; }
    const pr = e.target.closest('[data-pushresume]'); if (pr) { await api(`/api/pushes/${pr.dataset.pushresume}/resume`, { method: 'POST' }); RGS.toast('Picking up again'); ins.at = 0; renderInsp(); return; }
    const pd = e.target.closest('[data-pushdel]');
    if (pd) { if (!(await V.ask({ title: 'Remove this copy from the list?', body: 'Nothing is deleted in GHL.', ok: 'Remove', danger: true }))) return; await api(`/api/pushes/${pd.dataset.pushdel}`, { method: 'DELETE' }); ins.at = 0; renderInsp(); return; }
    const b = e.target.closest('[data-run],[data-sync],[data-cancel],[data-resume],[data-retry],[data-reset],[data-del]'); if (!b) return;
    if (b.dataset.run) { const r = await api('/api/jobs', { method: 'POST', body: { locationId: b.dataset.run, sources: manualSources() } }); RGS.toast(r.error || 'Backup started', r.error ? { error: true } : {}); ins.at = 0; load(); }
    else if (b.dataset.sync) { const r = await api('/api/jobs', { method: 'POST', body: { locationId: b.dataset.sync, sources: manualSources(), incremental: true } }); RGS.toast(r.error || `Getting changes since ${DT(r.since)}`, r.error ? { error: true } : {}); ins.at = 0; load(); }
    else if (b.dataset.cancel) { await api(`/api/jobs/${b.dataset.cancel}/cancel`, { method: 'POST' }); RGS.toast('Stopping after the current page'); ins.at = 0; load(); }
    else if (b.dataset.resume) { await api(`/api/jobs/${b.dataset.resume}/resume`, { method: 'POST' }); RGS.toast('Picking up again'); ins.at = 0; load(); }
    else if (b.dataset.retry) { await api(`/api/jobs/${b.dataset.retry}/retry-failed`, { method: 'POST' }); RGS.toast('Trying failed files again'); ins.at = 0; load(); }
    else if (b.dataset.reset || b.dataset.del) {
      const loc = b.dataset.reset || b.dataset.del, del = !!b.dataset.del;
      const name = (state.locs.find((l) => l.location_id === loc) || {}).name || loc;
      const r0 = await V.ask({ title: del ? `Remove ${name} from the vault?` : `Reset ${name}?`, body: `This forgets its backups, file records, contacts and packages${del ? ' and stops tracking it' : ''}.`, ok: del ? 'Remove' : 'Reset', danger: true, icon: 'trash', grad: '--t-pink', toggle: { label: 'Also delete the saved files', sub: 'Removes what was already copied to your storage' } });
      if (!r0.ok) return;
      const r = await api(`/api/locations/${encodeURIComponent(loc)}${del ? '' : '/reset'}`, { method: del ? 'DELETE' : 'POST', body: { purgeR2: r0.toggled } });
      if (r.error) return RGS.toast(r.error, { error: true });
      RGS.toast(`${del ? 'Removed' : 'Reset'}${r0.toggled ? ` · ${N(r.r2Deleted)} saved files deleted` : ''}`);
      if (del) selectLoc(null); else ins.at = 0;
      load(); loadBackup();
    }
  });

  // keyboard: / search · ↑↓ move · esc close
  document.addEventListener('keydown', (e) => {
    if (V.sheetOpen()) return;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }
    if (e.key === 'Escape') { closeMenu(); if (typing) document.activeElement.blur(); selectLoc(null); return; }
    if (typing && document.activeElement !== $('q')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const items = [...document.querySelectorAll('#rows .li[data-loc]')]; if (!items.length) return;
      e.preventDefault();
      let i = items.findIndex((x) => x.dataset.loc === state.sel);
      i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      selectLoc(items[i].dataset.loc, { scroll: true });
    }
    if (e.key === 'Enter' && document.activeElement === $('q')) { const f = document.querySelector('#rows .li[data-loc]'); if (f) selectLoc(f.dataset.loc); }
  });

  // ---------- boot ----------
  V.nav('vault');
  RGS.ready.then(() => {
    I = (n) => RGS.icon(n);
    $('moreBtn').innerHTML = I('more');
    $('schedBtn').innerHTML = `${I('calendar')}Schedule`;
    $('bkNow').innerHTML = `${I('download')}Back up all now`;
    skeleton();
    // The sidebar's sub-account is shared across tools: picking one there opens it here when it's in the vault.
    RGS.onLocation((loc) => { if (loc && (state.locs || []).some((l) => l.location_id === loc.locationId)) selectLoc(loc.locationId, { scroll: true }); });
    loadOrphans();
    Promise.all([load(), loadBackup()]).then(() => {
      if (!state.sel && window.innerWidth > 1100) { const cur = RGS.location(); if (cur && (state.locs || []).some((l) => l.location_id === cur.locationId)) selectLoc(cur.locationId); }
    });
    setInterval(load, 8000); setInterval(loadBackup, 30000);
  });
})();
</script>
</body>
</html>
