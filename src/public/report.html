<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account activity report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vault.css">
<script src="/vault.js" data-page="report"></script>
<style>
  header.rep{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:30px 36px 18px;border-bottom:1px solid var(--line)}
  header.rep .brand{font:600 10.5px/1 "Schibsted Grotesk",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);width:100%;margin-bottom:10px}
  header.rep h1{font-size:34px}header.rep .r{color:var(--dim);font-size:13px;margin-left:auto}
  main{padding:22px 36px 72px;max-width:1300px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  table{white-space:nowrap}th{text-align:right}th:first-child,td:first-child{text-align:left}td{text-align:right}
  @media print{.bar{display:none}}
</style>
</head>
<body>
<header class="rep"><span class="brand">Account activity report</span><h1 id="title">Account activity</h1><span class="r" id="range"></span></header>
<main>
  <div class="bar"><div class="seg"><button data-d="7">Last 7 days</button><button data-d="30" class="on">Last 30 days</button><button data-d="90">Last 90 days</button></div><span style="flex:1"></span><button class="btn" onclick="window.vaultTheme.toggle()">Light / dark</button><button class="btn primary" onclick="print()">Print / PDF</button></div>
  <div class="kpis" id="kpis"></div>
  <h2 class="sec">Daily activity</h2><div class="card"><div class="chart" id="chart"></div><div class="legend"><span><i class="s"></i>SMS out</span><span><i class="e"></i>Email out</span><span><i class="c"></i>Calls</span><span><i class="i"></i>Inbound</span></div></div>
  <h2 class="sec">Team</h2><div class="card"><div class="tableWrap"><table id="t"><thead></thead><tbody></tbody></table></div>
  <div class="note">Active = activity in the last 7 days on 3+ days · Low = activity within 30 days · Inactive = none in 30+ days · Talk time = total call duration.</div></div>
</main>
<script>
const token=location.pathname.split('/').pop();const $=s=>document.querySelector(s);const N=n=>Number(n||0).toLocaleString();
const mins=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};const D=s=>s?new Date(s).toLocaleDateString():'—';
async function load(days=30){
  const to=new Date(),from=new Date(to.getTime()-days*86400000);const iso=d=>d.toISOString().slice(0,10);
  const r=await fetch(`/api/report/${token}?from=${iso(from)}&to=${iso(to)}`).then(r=>r.json());
  $('#title').textContent=`${r.name||'Account'} — activity report`;$('#range').textContent=`${from.toLocaleDateString()} – ${to.toLocaleDateString()}`;
  const s=r.summary;$('#kpis').innerHTML=[['New contacts',N(s.contacts.created)],['Outbound messages',N(s.messages.outbound)],['Inbound messages',N(s.messages.inbound)],['Calls',N(s.messages.calls)],['Talk time',mins(s.messages.talk_seconds)],['Active users',N(s.messages.active_users)],['Opportunities won',N(s.opportunities.won)],['Won value',`$${N(Math.round(s.opportunities.won_value))}`],['Appointments',N(s.appointments.booked)]]
    .map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  const max=Math.max(1,...r.daily.map(d=>d.sms+d.email+d.calls+d.inbound));
  $('#chart').innerHTML=r.daily.map(d=>`<div class="d" title="${d.day.slice(0,10)}"><div class="s" style="height:${110*d.sms/max}px"></div><div class="e" style="height:${110*d.email/max}px"></div><div class="c" style="height:${110*d.calls/max}px"></div><div class="i" style="height:${110*d.inbound/max}px"></div></div>`).join('');
  const cols=[['User',u=>`<b>${u.name||'(unknown)'}</b>`],['Status',u=>`<span class="pill ${u.status}">${u.status}</span>`],['SMS',u=>N(u.sms_out)],['Email',u=>N(u.email_out)],['Calls',u=>N(u.calls_out+u.calls_in)],['Talk',u=>mins(u.talk_seconds)],['Contacts touched',u=>N(u.contacts_touched)],['Created',u=>N(u.contacts_created)],['Opps',u=>N(u.opps_created)],['Won',u=>N(u.opps_won)],['Appts',u=>N(u.appointments)],['Active days',u=>N(u.active_days)],['Last activity',u=>D(u.last_activity)]];
  $('#t thead').innerHTML='<tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
  $('#t tbody').innerHTML=r.users.map(u=>'<tr>'+cols.map(c=>`<td>${c[1](u)}</td>`).join('')+'</tr>').join('');
}
document.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-d]').forEach(x=>x.classList.toggle('on',x===b));load(Number(b.dataset.d))});load();
</script>
</body>
</html>
